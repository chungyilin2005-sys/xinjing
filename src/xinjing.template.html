<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>般若波羅蜜多心經</title>
<!-- 主畫面與分頁圖示：build.py 產生的 icons/icon-512.png 以 base64 內嵌 -->
<link rel="icon" type="image/png" sizes="512x512" href="data:image/png;base64,__ICON_B64__" id="appIcon">
<link rel="apple-touch-icon" href="data:image/png;base64,__ICON_B64__">
<meta name="application-name" content="心經">
<meta name="apple-mobile-web-app-title" content="心經">
<meta name="theme-color" content="#ECEBE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16203A" media="(prefers-color-scheme: dark)">
<style>
@font-face{font-family:"WenKai";src:url(data:font/woff2;base64,__FONT_B64__) format("woff2");font-display:block}
:root{
  --paper:#ECEBE6;--surface:#F7F6F2;--ink:#24231F;--ink-soft:#6C6A63;--line:#D5D2C8;
  --accent:#2C4775;--on-accent:#F7F6F2;--zhu:#B03A2E;--hl:rgba(44,71,117,.13);
  --guide:rgba(36,35,31,.15);--stroke:#1C1B18;--grid:rgba(176,58,46,.28);
  --sutra-font:"WenKai","Kaiti TC","BiauKai","DFKai-SB",serif;
  --fs:26px;--nfs:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16203A;--surface:#1D2946;--ink:#E8E0C8;--ink-soft:#A39E89;--line:#2F3D66;
    --accent:#D3B169;--on-accent:#16203A;--zhu:#C9634F;--hl:rgba(211,177,105,.17);
    --guide:rgba(211,177,105,.2);--stroke:#D8B86C;--grid:rgba(211,177,105,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16203A;--surface:#1D2946;--ink:#E8E0C8;--ink-soft:#A39E89;--line:#2F3D66;
  --accent:#D3B169;--on-accent:#16203A;--zhu:#C9634F;--hl:rgba(211,177,105,.17);
  --guide:rgba(211,177,105,.2);--stroke:#D8B86C;--grid:rgba(211,177,105,.22);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:"WenKai","Kaiti TC","BiauKai",serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

header{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line)}
.brand{font-size:20px;letter-spacing:.3em;margin:0;font-weight:400;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:none;border:0;font-size:17px;padding:8px 10px;min-height:44px;color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.icon-btn{background:none;border:0;min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--ink-soft);cursor:pointer;border-radius:22px}
.icon-btn svg{width:22px;height:22px}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* 讀誦 */
.scroll{flex:1;min-height:0;overflow:auto;padding:28px 22px;overscroll-behavior:contain}
.scroll.v{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden}
.scroll.h .sutra,.scroll.h .notes,.scroll.h .prose,.scroll.h .after{max-width:30em;margin-left:auto;margin-right:auto}
.sutra{font-family:var(--sutra-font);font-size:var(--fs);line-height:2.15;letter-spacing:.14em}
.sutra .title{font-size:1.28em;font-weight:400;margin:0;letter-spacing:.24em}
.sutra .translator{font-size:.58em;color:var(--ink-soft);margin:0 0 1.6em;text-align:end;letter-spacing:.2em}
.scroll.v .sutra .translator{margin:0 0 1.4em}
.sutra .body{margin:0}
.cl{border-radius:5px;cursor:pointer;transition:background-color .25s,color .25s}
.cl.on{background:var(--hl);color:var(--accent)}
.cl.on2{color:var(--accent)}
.scroll.v .sutra .end{margin-inline-start:0}
/* 白話、註解 */
.after{font-family:"WenKai","Kaiti TC","BiauKai",serif;margin-top:1.6em;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;letter-spacing:.08em}
.scroll.v .after{margin:0 1.6em 0 0}
.notes-toggle{font-size:17px;min-height:44px;min-width:44px;padding:8px 16px;border-radius:22px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.pl{display:block;font-size:var(--nfs);line-height:1.9;letter-spacing:.04em;color:var(--ink-soft);margin-block:.25em .95em;cursor:pointer;transition:color .25s}
.pl.on{color:var(--accent)}
.nt{display:block;font-size:var(--nfs);line-height:1.95;letter-spacing:.05em;margin-block:.25em 1em;padding-inline-start:.6em;border-inline-start:2px solid var(--line)}
.ns{border-radius:4px;cursor:pointer;transition:background-color .25s,color .25s}
.ns.on{background:var(--hl);color:var(--accent)}
.pp{display:inline-grid;place-items:center;width:44px;height:44px;margin:-10px 2px -10px -6px;border:0;background:none;color:var(--accent);cursor:pointer;vertical-align:middle;border-radius:22px}
.scroll.v .pp{margin:-6px -10px 2px -10px}
.pp svg{width:16px;height:16px}
.src{display:block;font-size:13px;line-height:1.7;letter-spacing:.04em;color:var(--ink-soft);margin-block:.6em 0}
.notes{font-family:var(--sutra-font);font-size:var(--nfs);line-height:2;letter-spacing:.06em}
.notes .nj{color:var(--ink-soft);font-size:.86em;letter-spacing:.14em;margin:0 0 .2em}
.notes .nt{border:0;padding:0;margin:0 0 1.3em}
.notes .pl{margin:0 0 1.3em}
.scroll.v .notes .nj{margin:0 0 0 .2em}
.scroll.v .notes .nt,.scroll.v .notes .pl{margin:0 0 0 1.3em}
.notes .credit{font-size:.86em;color:var(--ink-soft);margin:0 0 1.4em;letter-spacing:.1em}
.scroll.v .notes .credit{margin:0 0 0 1.4em}
.prose{font-family:var(--sutra-font);font-size:var(--nfs);line-height:2.1;letter-spacing:.08em}
.prose h2{font-size:1.3em;font-weight:400;letter-spacing:.25em;margin:0 0 1em}
.scroll.v .prose h2{margin:0 0 0 1em}
.prose p{margin:0 0 1em;text-indent:2em}
.scroll.v .prose p{margin:0 0 0 .6em}

.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.btn{font-size:16px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sq{width:44px;padding:0}
.btn.rate{font-size:14px;padding:0 10px}

/* 描寫 */
.trace-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0 16px;color:var(--ink-soft);font-size:15px}
.trace-top b{color:var(--ink);font-weight:400}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 16px}
.cell{position:relative;background:var(--surface);border:1.5px solid var(--zhu);box-shadow:0 1px 0 var(--line)}
.cell canvas{position:absolute;inset:0;width:100%;height:100%}
#ink{touch-action:none;cursor:crosshair}
.hint{color:var(--ink-soft);font-size:14px;text-align:center;margin:0 16px 4px;min-height:1.2em}

/* 整篇 */
.overlay{position:fixed;inset:0;z-index:20;background:var(--paper);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay.on{display:flex}
.overlay header{gap:8px}
.overlay h2{font-size:18px;font-weight:400;margin:0;letter-spacing:.15em}
.grid-wrap{flex:1;min-height:0;overflow:auto;padding:16px}
.grid{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.grid-wrap.v{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden}
.mini{width:46px;height:46px;border:1px solid var(--grid);background:var(--surface);padding:0;cursor:pointer;position:relative}
.mini.cur{outline:2px solid var(--accent);outline-offset:1px}
.mini canvas{width:100%;height:100%;display:block}
.grid .gap{flex-basis:100%;width:0;height:0}

/* 設定 */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(10,12,20,.38);display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:16px 16px 0 0;padding:6px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.sheet h3{font-size:15px;font-weight:400;color:var(--ink-soft);margin:18px 0 8px}
.row{display:flex;align-items:center;gap:12px}
.row input[type=range]{flex:1;accent-color:var(--accent);height:32px}
.row output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:none;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.opt input{accent-color:var(--accent);width:20px;height:20px}
.opt small{color:var(--ink-soft)}
[hidden]{display:none!important}
.sel{width:100%;min-height:44px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.seg+.seg,.seg+.sel,.sel+.row,.seg+.row{margin-top:10px}
.seg button:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:6px 0 0}
.danger{color:var(--zhu);border-color:var(--zhu)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;line-height:1.5;max-width:88%;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:720px){.brand{font-size:22px}.mini{width:56px;height:56px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="brand">心經</h1>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="read" aria-selected="true">讀誦</button>
      <button class="tab" role="tab" data-view="trace" aria-selected="false">描寫</button>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="切換夜間模式"></button>
    <button class="icon-btn" id="openSettings" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <main>
    <section class="view on" id="view-read" aria-label="讀誦">
      <div class="scroll v" id="scroll">
        <div class="sutra" id="sutra"></div>
        <div class="after">
          <button class="notes-toggle" id="notesBtn" hidden>註解</button>
          <button class="notes-toggle" id="plainBtn" hidden>白話</button>
          <button class="notes-toggle" id="prefBtn" hidden>御製心經序</button>
        </div>
      </div>
      <div class="bar">
        <button class="btn sq" id="fsDown" aria-label="字縮小">小</button>
        <button class="btn sq" id="fsUp" aria-label="字放大">大</button>
        <button class="btn primary" id="play">朗讀</button>
        <button class="btn sq" id="stop" aria-label="停止" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
        </button>
        <button class="btn rate" id="rate">語速 0.8</button>
      </div>
    </section>

    <section class="view" id="view-trace" aria-label="描寫">
      <div class="trace-top">
        <span id="pos"></span>
        <button class="btn" id="openSheet">整篇</button>
      </div>
      <div class="stage" id="stage">
        <div class="cell" id="cell">
          <canvas id="guide"></canvas>
          <canvas id="ink"></canvas>
        </div>
      </div>
      <p class="hint" id="hint">用手指沿著淡字描寫</p>
      <div class="bar">
        <button class="btn" id="prev">上一字</button>
        <button class="btn" id="undo">復原</button>
        <button class="btn" id="clear">清除</button>
        <button class="btn primary" id="next">下一字</button>
      </div>
    </section>

    <section class="view" id="view-preface" aria-label="御製心經序">
      <div class="scroll v" id="prefScroll"><div class="prose" id="preface"></div></div>
      <div class="bar">
        <button class="btn sq" data-nfs="-1" aria-label="序文字縮小">小</button>
        <button class="btn sq" data-nfs="1" aria-label="序文字放大">大</button>
        <button class="btn primary" id="prefBack">回到經文</button>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="notesView" aria-label="註解">
  <header>
    <button class="icon-btn" id="closeNotes" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2>註解</h2>
  </header>
  <div class="scroll v" id="notesScroll"></div>
  <div class="bar">
    <button class="btn sq" data-nfs="-1" aria-label="註解字縮小">小</button>
    <button class="btn sq" data-nfs="1" aria-label="註解字放大">大</button>
    <button class="btn primary" id="nPlay">朗讀註解</button>
    <button class="btn sq" id="nStop" aria-label="停止" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div class="overlay" id="plainView" aria-label="白話">
  <header>
    <button class="icon-btn" id="closePlain" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2>白話</h2>
  </header>
  <div class="scroll v" id="plainScroll"></div>
  <div class="bar">
    <button class="btn sq" data-nfs="-1" aria-label="白話字縮小">小</button>
    <button class="btn sq" data-nfs="1" aria-label="白話字放大">大</button>
    <button class="btn primary" id="pPlay">朗讀白話</button>
    <button class="btn sq" id="pStop" aria-label="停止" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div class="overlay" id="sheetView" aria-label="整篇">
  <header>
    <button class="icon-btn" id="closeSheet" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2>整篇</h2>
    <span id="doneCount" style="color:var(--ink-soft);font-size:15px;margin-left:auto"></span>
    <button class="btn" id="exportImg" hidden>存成圖片</button>
  </header>
  <div class="grid-wrap v" id="gridWrap"><div class="grid" id="grid"></div></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="settings" role="dialog" aria-label="設定">
  <div class="grab"></div>
  <h3>外觀</h3>
  <div class="seg" id="themeSeg">
    <button data-theme-opt="auto" aria-pressed="true">跟隨系統</button>
    <button data-theme-opt="light" aria-pressed="false">日間</button>
    <button data-theme-opt="dark" aria-pressed="false">夜間</button>
  </div>
  <h3>朗讀聲音</h3>
  <div class="seg" id="engineSeg">
    <button data-engine="claude" aria-pressed="false">Claude 語音</button>
    <button data-engine="device" aria-pressed="false">手機語音</button>
    <button data-engine="rec" aria-pressed="false" hidden>預錄</button>
  </div>
  <div class="seg" id="cvoiceSeg">
    <button data-cvoice="buttery" aria-pressed="false">柔順</button>
    <button data-cvoice="airy" aria-pressed="false">輕盈</button>
    <button data-cvoice="glassy" aria-pressed="false">清亮</button>
    <button data-cvoice="rounded" aria-pressed="false">圓潤</button>
  </div>
  <select class="sel" id="dvoiceSel" aria-label="手機語音"></select>
  <div class="row" id="pitchRow"><span>音高</span><input type="range" id="pitchRange" min="0.7" max="1.3" step="0.05" aria-label="音高"><output id="pitchOut"></output></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="testVoice">試聽</button></div>
  <p class="note" id="voiceNote"></p>
  <div id="extraSettings">
    <h3>註解</h3>
    <div class="seg" id="notesSeg">
      <button data-notes="end" aria-pressed="true">篇末</button>
      <button data-notes="line" aria-pressed="false">逐段對照</button>
    </div>
    <h3>白話</h3>
    <div class="seg" id="plainSeg">
      <button data-plain="off" aria-pressed="true">不顯示</button>
      <button data-plain="end" aria-pressed="false">篇末</button>
      <button data-plain="line" aria-pressed="false">逐段對照</button>
    </div>
    <h3>朗讀註解</h3>
    <div class="seg" id="readNotesSeg">
      <button data-rn="off" aria-pressed="true">不念</button>
      <button data-rn="after" aria-pressed="false">整篇接念</button>
      <button data-rn="inter" aria-pressed="false">逐段交錯</button>
    </div>
    <h3>朗讀白話</h3>
    <div class="seg" id="readPlainSeg">
      <button data-rp="off" aria-pressed="true">不念</button>
      <button data-rp="after" aria-pressed="false">整篇接念</button>
      <button data-rp="inter" aria-pressed="false">逐段交錯</button>
    </div>
    <p class="note">整篇接念：經文念完，再念白話、註解。逐段交錯：每段經文後接著念該段的白話、註解。白話、註解會用和經文不同的聲音。白話是 Claude 依註解意譯，未經專家審訂，僅供參考。</p>
  </div>
  <h3>經文字級</h3>
  <div class="row"><input type="range" id="fsRange" min="16" max="60" step="1" aria-label="經文字級"><output id="fsOut"></output></div>
  <h3>註解、白話與序的字級</h3>
  <div class="row"><input type="range" id="nfsRange" min="14" max="40" step="1" aria-label="註解、白話與序的字級"><output id="nfsOut"></output></div>
  <h3>排版</h3>
  <div class="seg" id="layoutSeg">
    <button data-layout="v" aria-pressed="true">直排</button>
    <button data-layout="h" aria-pressed="false">橫排</button>
  </div>
  <h3>字體</h3>
  <label class="opt"><input type="radio" name="font" value="wenkai"> 霞鶩文楷 <small>內建</small></label>
  <label class="opt"><input type="radio" name="font" value="user" id="userFontRadio" disabled> <span id="userFontName">自訂字體 <small>尚未選擇</small></span></label>
  <label class="opt"><input type="radio" name="font" value="system"> 裝置內建楷體 <small>依手機而定</small></label>
  <div class="row" style="margin-top:6px">
    <button class="btn" id="pickFont">選擇字體檔…</button>
    <button class="btn" id="removeFont" hidden>移除</button>
    <input type="file" id="fontFile" hidden>
  </div>
  <p class="note">可選 .ttf、.otf、.woff 或 .woff2。字體只存在這支手機的瀏覽器裡，換裝置要重新選一次。經文與描寫的淡字都會改用這套字體。</p>
  <h3>描寫筆畫粗細</h3>
  <div class="row"><input type="range" id="penRange" min="2" max="8" step="0.5"><output id="penOut"></output></div>
  <h3>描寫紀錄</h3>

<script>
(function(){
"use strict";
var TITLE="般若波羅蜜多心經";
var TRANSLATOR="唐三藏法師玄奘　譯";
var BODY="觀自在菩薩，行深般若波羅蜜多時，照見五蘊皆空，度一切苦厄。舍利子，色不異空，空不異色，色即是空，空即是色，受想行識，亦復如是。舍利子，是諸法空相，不生不滅，不垢不淨，不增不減。是故空中無色，無受想行識，無眼耳鼻舌身意，無色聲香味觸法，無眼界，乃至無意識界，無無明，亦無無明盡，乃至無老死，亦無老死盡。無苦集滅道，無智亦無得。以無所得故，菩提薩埵，依般若波羅蜜多故，心無罣礙，無罣礙故，無有恐怖，遠離顛倒夢想，究竟涅槃。三世諸佛，依般若波羅蜜多故，得阿耨多羅三藐三菩提。故知般若波羅蜜多，是大神咒，是大明咒，是無上咒，是無等等咒，能除一切苦，真實不虛。故說般若波羅蜜多咒，即說咒曰：揭諦揭諦，波羅揭諦，波羅僧揭諦，菩提薩婆訶。";
var PUNCT=/[，。：；、]/g;
var clauses=[TITLE].concat(BODY.match(/[^，。：；]+[，。：；]?/g));
var CHARS=(TITLE+BODY.replace(PUNCT,"")).split("");
// 讀音校正：畫面顯示原文，送給語音引擎的是讀音正確的替代字
var SAY=[[/般若/g,"波惹"],[/舍利子/g,"社利子"],[/行/g,"形"],[/薩埵/g,"薩朵"],[/罣礙/g,"掛礙"]];
function spoken(t){SAY.forEach(function(r){t=t.replace(r[0],r[1]);});return t;}

function sayNote(t){t=spoken(t);SAY_NOTE.forEach(function(r){t=t.replace(r[0],r[1]);});return t;}
function spokenNote(t){return sayNote(t).replace(/者。/g,"者，");}
function spokenPlain(t){return sayNote(t).replace(/（/g,"，").replace(/）/g,"，").replace(/，+/g,"，").replace(/，([。？！；：」、])/g,"$1").replace(/，$/,"。");}

var $=function(id){return document.getElementById(id);};

var S=Object.assign({fs:26,nfs:18,layout:"v",font:"wenkai",pen:4,rate:0.8,theme:"auto",engine:"auto",cvoice:"buttery",dvoice:"",pitch:1,notes:"end",plain:"off",readNotes:"off",readPlain:"off"},load("xj.set",{}));

/* ---------- 字體 ---------- */

// IndexedDB 存放使用者字體
function idb(){return new Promise(function(res,rej){try{var q=indexedDB.open("xinjing",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv");};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};}catch(e){rej(e);}});}
function idbGet(k){return idb().then(function(db){return new Promise(function(res){var r=db.transaction("kv").objectStore("kv").get(k);r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res){var tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};});}).catch(function(){return false;});}

document.querySelectorAll('input[name=font]').forEach(function(r){r.onchange=function(){S.font=r.value;saveS();applyFont();};});

/* ---------- 註解、白話、序（build.py 由 data/ 內嵌） ---------- */
// {segs:[{r:[起,迄子句], n:[註解小句…], p:"白話"}], preface:[段落], preface_title, credit}
var DATA=/*__DATA__*/null;
if(!DATA)DATA={segs:[{r:[0,0],n:[],p:""},{r:[1,clauses.length-1],n:[],p:""}],preface:[],preface_title:"",credit:""};
var SEGS=DATA.segs;
var hasNotes=SEGS.some(function(s){return s.n.length>0;}),hasPlain=SEGS.some(function(s){return !!s.p;});
var NOTE_SRC="註解：明・宗泐、如玘《般若波羅蜜多心經註解》（大正藏第三十三冊），依玄奘譯本作註";
var PLAIN_SRC="白話：Claude 依宗泐、如玘註解意譯，未經專家審訂，僅供參考";
var PLAY='<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
function segOf(i){for(var k=0;k<SEGS.length;k++)if(SEGS[k].r[0]<=i&&i<=SEGS[k].r[1])return k;return 0;}
function segText(k){if(k===0)return "經題";var r=SEGS[k].r;return clauses.slice(r[0],r[1]+1).join("").replace(/[，。：；]$/,"");}
// 朗讀時暫時改變的顯示方式（逐段交錯時用逐段對照；整篇接念白話而白話沒顯示時用篇末面板），念完收回
var temp={p:"",n:""};
function effPlain(){return hasPlain?(temp.p||S.plain):"off";}
function effNotes(){return hasNotes?(temp.n||S.notes):"off";}

/* ---------- 讀誦：版面 ---------- */
function mkPlain(k,tag){var e=document.createElement(tag);e.className="pl";e.dataset.s=String(k);e.textContent=SEGS[k].p;return e;}
function mkNotes(k,tag){
  var e=document.createElement(tag);e.className="nt";e.dataset.s=String(k);
  var pb=document.createElement("button");pb.className="pp";pb.innerHTML=PLAY;pb.dataset.s=String(k);pb.setAttribute("aria-label","從這一段開始朗讀註解");
  e.appendChild(pb);
  SEGS[k].n.forEach(function(t,c){var sp=document.createElement("span");sp.className="ns";sp.dataset.s=String(k);sp.dataset.c=String(c);sp.textContent=t;e.appendChild(sp);});
  return e;
}
function mkSrc(t){var e=document.createElement("span");e.className="src";e.textContent=t;return e;}
function buildRead(){
  var ep=effPlain(),en=effNotes();
  function extras(k,parent){
    if(ep==="line"&&SEGS[k].p)parent.appendChild(mkPlain(k,"span"));
    if(en==="line"&&SEGS[k].n.length)parent.appendChild(mkNotes(k,"span"));
  }
  var el=$("sutra");el.innerHTML="";
  var h=document.createElement("p");h.className="title";
  var t=document.createElement("span");t.className="cl";t.dataset.i="0";t.textContent=TITLE;h.appendChild(t);
  var tr=document.createElement("p");tr.className="translator";tr.textContent=TRANSLATOR;
  el.append(h,tr);
  var x0=document.createElement("div");extras(0,x0);if(x0.childNodes.length)el.appendChild(x0);
  var ends={};SEGS.forEach(function(s,k){ends[s.r[1]]=k;});
  var b=document.createElement("p");b.className="body";
  for(var i=1;i<clauses.length;i++){
    var s=document.createElement("span");s.className="cl";s.dataset.i=String(i);s.textContent=clauses[i];b.appendChild(s);
    if(ends[i])extras(ends[i],b);
  }
  el.appendChild(b);
  if(en==="line")el.appendChild(mkSrc(NOTE_SRC));
  if(ep==="line")el.appendChild(mkSrc(PLAIN_SRC));
  $("notesBtn").hidden=en!=="end";$("plainBtn").hidden=ep!=="end";$("prefBtn").hidden=!DATA.preface.length;
  // 篇末面板（直排、橫排都另開全螢幕面板）
  var ns=$("notesScroll");ns.innerHTML="";
  if(en==="end"){
    var w=document.createElement("div");w.className="notes";
    var cr=document.createElement("p");cr.className="credit";cr.textContent="般若波羅蜜多心經註解　"+DATA.credit;w.appendChild(cr);
    SEGS.forEach(function(s,k){
      if(!s.n.length)return;
      var j=document.createElement("p");j.className="nj";j.textContent=segText(k);w.appendChild(j);
      w.appendChild(mkNotes(k,"p"));
    });
    w.appendChild(mkSrc(NOTE_SRC));ns.appendChild(w);
  }
  var ps=$("plainScroll");ps.innerHTML="";
  if(ep==="end"){
    var w2=document.createElement("div");w2.className="notes";
    SEGS.forEach(function(s,k){
      if(!s.p)return;
      var j=document.createElement("p");j.className="nj";j.textContent=segText(k);w2.appendChild(j);
      w2.appendChild(mkPlain(k,"p"));
    });
    w2.appendChild(mkSrc(PLAIN_SRC));ps.appendChild(w2);
  }
  if(en!=="end")$("notesView").classList.remove("on");
  if(ep!=="end")$("plainView").classList.remove("on");
}
function buildPreface(){
  var el=$("preface");el.innerHTML="";
  var h=document.createElement("h2");h.textContent=DATA.preface_title||"御製心經序";el.appendChild(h);
  DATA.preface.forEach(function(t){var p=document.createElement("p");p.textContent=t;el.appendChild(p);});
}
function applyLayout(){
  [$("scroll"),$("prefScroll"),$("notesScroll"),$("plainScroll")].forEach(function(sc){sc.className="scroll "+S.layout;sc.scrollLeft=0;sc.scrollTop=0;});
  $("gridWrap").className="grid-wrap "+S.layout;
  document.querySelectorAll("#layoutSeg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.layout===S.layout));});
}
function applyFs(){
  document.documentElement.style.setProperty("--fs",S.fs+"px");
  document.documentElement.style.setProperty("--nfs",S.nfs+"px");
  $("fsRange").value=S.fs;$("fsOut").textContent=S.fs+" px";
  $("nfsRange").value=S.nfs;$("nfsOut").textContent=S.nfs+" px";
}
// 讀誦畫面的「小」「大」：經文 ±3 px，註解、白話 ±2 px 一起調整
function bumpText(d){
  S.fs=Math.min(60,Math.max(16,S.fs+3*d));S.nfs=Math.min(40,Math.max(14,S.nfs+2*d));
  applyFs();saveS();
  if(hasNotes||hasPlain)toast("經文 "+S.fs+" px・註解與白話 "+S.nfs+" px",1400);
}
$("fsUp").onclick=function(){bumpText(1);};
$("fsDown").onclick=function(){bumpText(-1);};
// 序頁、註解與白話面板的「小」「大」：只調整註解、白話與序
document.querySelectorAll("[data-nfs]").forEach(function(b){b.onclick=function(){
  S.nfs=Math.min(40,Math.max(14,S.nfs+2*(+b.dataset.nfs)));applyFs();saveS();toast("註解與白話 "+S.nfs+" px",1400);
};});
$("fsRange").oninput=function(e){S.fs=+e.target.value;applyFs();saveS();};
$("nfsRange").oninput=function(e){S.nfs=+e.target.value;applyFs();saveS();};
document.querySelectorAll("#layoutSeg button").forEach(function(b){b.onclick=function(){S.layout=b.dataset.layout;saveS();applyLayout();renderGrid();};});
function applyReadUI(){
  $("extraSettings").hidden=!(hasNotes||hasPlain);
  function seg(id,attr,val){document.querySelectorAll("#"+id+" button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset[attr]===val));});}
  seg("notesSeg","notes",S.notes);seg("plainSeg","plain",S.plain);seg("readNotesSeg","rn",S.readNotes);seg("readPlainSeg","rp",S.readPlain);
}
function onSeg(id,attr,key){document.querySelectorAll("#"+id+" button").forEach(function(b){b.onclick=function(){
  if(S[key]===b.dataset[attr])return;
  stopAll();S[key]=b.dataset[attr];saveS();applyReadUI();buildRead();
};});}
onSeg("notesSeg","notes","notes");onSeg("plainSeg","plain","plain");onSeg("readNotesSeg","rn","readNotes");onSeg("readPlainSeg","rp","readPlain");
$("notesBtn").onclick=function(){$("plainView").classList.remove("on");$("notesView").classList.add("on");};
$("plainBtn").onclick=function(){$("notesView").classList.remove("on");$("plainView").classList.add("on");};
$("closeNotes").onclick=function(){$("notesView").classList.remove("on");};
$("closePlain").onclick=function(){$("plainView").classList.remove("on");};
$("prefBtn").onclick=function(){go("preface");};

/* ---------- 讀誦：語音 ---------- */
// 引擎：rec = 預錄；claude = Claude 語音（tts 能力，整段一行送出）；native = 手機的 speechSynthesis（逐句送出）
// 朗讀單位（item）：j:段 = 經文、p:段 = 白話、n:段:句 = 註解。依設定排成佇列 Q 依序念。
var RATES=[0.6,0.7,0.8,1,1.2];
var state="idle",token=0,voice=null,eng=null,claudeTts=null,claudeOff=false,dvoices=[];
var Q=[],qi=0,sub=0,qFrom=null,q0=0,qOnly=null;
// 預錄朗讀：build.py 由 audio/ 內嵌 {voice, voices:{j,n}, items:[{id, type, b64}]}；沒有音檔時為 null
// 白話不預錄：預錄模式下白話改用手機語音念（recPlain）
var REC=/*__AUDIO__*/null;
var VOICE_NAMES={"zh-TW-HsiaoYuNeural":"曉雨","zh-TW-HsiaoChenNeural":"曉臻","zh-TW-YunJheNeural":"雲哲"};
var recMap=null,recUrl={},audio=null,recPos=0;
function recReady(){return !!(REC&&REC.items&&REC.items.length);}
function recName(k){var v=REC&&(REC.voices&&REC.voices[k||"j"]||REC.voice);return (v&&VOICE_NAMES[v])||"";}
function recGet(id){
  if(!recMap){recMap={};REC.items.forEach(function(it){recMap[it.id]=it;});}
  var it=recMap[id];if(!it)return null;
  if(!recUrl[id]){
    var bin=atob(it.b64),u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    recUrl[id]=URL.createObjectURL(new Blob([u8],{type:it.type||"audio/mpeg"}));
  }
  return recUrl[id];
}
// 錄音以 0.8 為原速；語速設定換算成播放速度（Chrome 預設保持音高）
function recRate(){return S.rate/0.8;}

function mkItem(k,kind,c){return {id:kind==="n"?"n:"+k+":"+c:kind+":"+k,k:kind,s:k,c:c||0};}
function buildQueue(only){
  var q=[];
  function addP(k){if(SEGS[k].p)q.push(mkItem(k,"p"));}
  function addN(k){SEGS[k].n.forEach(function(t,c){q.push(mkItem(k,"n",c));});}
  var k;
  if(only==="p"){for(k=0;k<SEGS.length;k++)addP(k);return q;}
  if(only==="n"){for(k=0;k<SEGS.length;k++)addN(k);return q;}
  var rp=hasPlain?S.readPlain:"off",rn=hasNotes?S.readNotes:"off";
  for(k=0;k<SEGS.length;k++){q.push(mkItem(k,"j"));if(rp==="inter")addP(k);if(rn==="inter")addN(k);}
  if(rp==="after")for(k=0;k<SEGS.length;k++)addP(k);
  if(rn==="after")for(k=0;k<SEGS.length;k++)addN(k);
  return q;
}
function qIndex(id){for(var i=0;i<Q.length;i++)if(Q[i].id===id)return i;return -1;}
function itemText(it,from){
  var s=SEGS[it.s];
  if(it.k==="j"){var a=from!=null?from:s.r[0];return spoken(clauses.slice(a,s.r[1]+1).join(""));}
  if(it.k==="p")return spokenPlain(s.p);
  return spokenNote(s.n[it.c]);
}
// 項目之間的停頓（ms）
function gapAfter(it,nx){
  if(!nx)return 0;
  if(nx.k!==it.k)return 650;
  if(it.k==="j")return /，$/.test(clauses[SEGS[it.s].r[1]])?150:(it.s===0?600:420);
  return 300;
}

/* 標亮 */
function clearMarks(){document.querySelectorAll(".cl.on,.cl.on2,.ns.on,.pl.on").forEach(function(e){e.classList.remove("on");e.classList.remove("on2");});}
function reveal(el){
  if(!el)return;
  // 目標在面板裡就打開該面板、關掉另一個；在經文裡就關掉兩個面板
  var ov=el.closest(".overlay");
  ["notesView","plainView"].forEach(function(id){$(id).classList.toggle("on",!!ov&&ov.id===id);});
  el.scrollIntoView({block:"center",inline:"center",behavior:"smooth"});
}
function markClause(i){
  clearMarks();if(i<0)return;
  var el=document.querySelector('.cl[data-i="'+i+'"]');if(el){el.classList.add("on");reveal(el);}
}
function markItem(it,from){
  clearMarks();if(!it)return;
  var r=SEGS[it.s].r,i,el,first=null;
  if(it.k==="j"){
    for(i=(from!=null?from:r[0]);i<=r[1];i++){el=document.querySelector('.cl[data-i="'+i+'"]');if(el){el.classList.add("on");if(!first)first=el;}}
    reveal(first);return;
  }
  for(i=r[0];i<=r[1];i++){el=document.querySelector('.cl[data-i="'+i+'"]');if(el)el.classList.add("on2");}
  el=it.k==="p"?document.querySelector('.pl[data-s="'+it.s+'"]'):document.querySelector('.ns[data-s="'+it.s+'"][data-c="'+it.c+'"]');
  if(el){el.classList.add("on");reveal(el);}
}

/* 手機語音 */
var hasNative=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined";
function vlang(v){return (v.lang||"").replace("_","-").toLowerCase();}
function zhRank(v){
  var l=vlang(v);
  if(l==="zh-tw")return 0;
  if(/hant/.test(l))return 1;
  if(l==="zh-hk"||/yue/.test(l))return 3;
  if(l.indexOf("zh")===0||l.indexOf("cmn")===0)return 2;
  return -1;
}
function pickVoice(){
  if(!hasNative)return;
  var vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  dvoices=vs.filter(function(v){return zhRank(v)>=0;}).sort(function(a,b){
    return zhRank(a)-zhRank(b)||((a.localService===false)===(b.localService===false)?0:(a.localService===false?-1:1));
  });
  voice=dvoices.find(function(v){return v.voiceURI===S.dvoice;})||dvoices[0]||null;
  renderVoiceUI();
}
// 白話、註解改用同一類（同 zhRank）的其他中文語音；沒有其他語音時改變音高
function altVoice(n){
  if(!voice)return null;
  var same=dvoices.filter(function(v){return v!==voice&&zhRank(v)===zhRank(voice);});
  return same[n]||null;
}
function utter(text,kind){
  var u=new SpeechSynthesisUtterance(text),v=voice,p=S.pitch,a0=altVoice(0),a1=altVoice(1);
  if(kind==="p"){if(a0)v=a0;else p=Math.max(0.5,Math.round(S.pitch*0.85*100)/100);}
  else if(kind==="n"){if(a1)v=a1;else p=Math.min(1.6,Math.round(S.pitch*1.12*100)/100);}
  u.lang=v&&v.lang?v.lang:"zh-TW";if(v)u.voice=v;
  u.rate=S.rate;u.pitch=p;
  return u;
}
function splitLong(t){
  if(t.length<=40)return [t];
  var ps=t.match(/[^。；！？，]+[。；！？，]?/g)||[t],out=[],cur="";
  ps.forEach(function(p){if(cur&&(cur+p).length>40){out.push(cur);cur=p;}else cur+=p;});
  if(cur)out.push(cur);
  return out;
}
// 經文逐子句送出（避開 Android Chrome 長句中斷）；白話、註解超過 40 字再切開
function nativeParts(it,from){
  var s=SEGS[it.s],out=[];
  if(it.k==="j"){for(var i=(from!=null?from:s.r[0]);i<=s.r[1];i++)out.push({t:spoken(clauses[i]),cl:i});return out;}
  return splitLong(itemText(it)).map(function(t){return {t:t};});
}
function nativeStep(my){
  if(my!==token)return;
  if(qi>=Q.length){finish();return;}
  var it=Q[qi],parts=nativeParts(it,qi===q0?qFrom:null);
  if(sub>=parts.length){sub=0;qi++;nativeStep(my);return;}
  var pt=parts[sub];
  if(it.k==="j")markClause(pt.cl);else if(sub===0)markItem(it);
  var u=utter(pt.t,it.k);
  u.onend=function(){
    if(my!==token)return;
    var gap;
    if(sub+1<parts.length){sub++;gap=it.k==="j"?(/[。：]$/.test(clauses[pt.cl])?380:120):200;}
    else{gap=gapAfter(it,Q[qi+1]);sub=0;qi++;}
    setTimeout(function(){nativeStep(my);},gap);
  };
  u.onerror=function(ev){if(my!==token)return;if(ev.error==="interrupted"||ev.error==="canceled")return;toast("朗讀中斷了，請再按一次「繼續」");state="paused";setUI();};
  speechSynthesis.speak(u);
}

/* 預錄 */
// 關螢幕後要繼續念：Android Chrome 只讓「一直在播放」的網頁在背景出聲。
// 所以項目之間的停頓改播靜音（不用 setTimeout 空等），白話用手機語音念時也在底下循環播靜音，
// 讓同一個 audio 元素從頭到尾不中斷。關螢幕時手機語音會停，預錄模式就略過白話。
var plainSkipNoted=false,recGap=false,silUrl={};
function canNativePlain(){return hasNative&&!!voice;}
function silence(ms){
  // 8 kHz、8 位元單聲道的無聲 WAV
  ms=Math.max(100,Math.round(ms));
  if(silUrl[ms])return silUrl[ms];
  var n=Math.round(8000*ms/1000),b=new Uint8Array(44+n),dv=new DataView(b.buffer);
  function str(o,s){for(var i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);}
  str(0,"RIFF");dv.setUint32(4,36+n,true);str(8,"WAVEfmt ");dv.setUint32(16,16,true);
  dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);
  dv.setUint16(32,1,true);dv.setUint16(34,8,true);str(36,"data");dv.setUint32(40,n,true);
  for(var i=44;i<b.length;i++)b[i]=128;
  return (silUrl[ms]=URL.createObjectURL(new Blob([b],{type:"audio/wav"})));
}
function recPlay(my,url,rate,pos,loop,onend){
  if(!audio){audio=new Audio();audio.preload="auto";}
  audio.onended=function(){if(my===token)onend();};
  audio.loop=!!loop;
  audio.src=url;
  audio.defaultPlaybackRate=audio.playbackRate=rate;
  if(pos)audio.currentTime=pos;
  var pr=audio.play();
  if(pr&&pr.catch)pr.catch(function(e){
    if(my!==token||(e&&e.name==="AbortError"))return;
    finish();toast("無法播放預錄朗讀，請再按一次「朗讀」");
  });
}
// 念完一項：播一段靜音當停頓，再接下一項
function recNext(my,it){
  var gap=gapAfter(it,Q[qi+1]);qi++;sub=0;recPos=0;
  if(qi>=Q.length||!gap){recGap=false;recItem(my,0);return;}
  recGap=true;
  recPlay(my,silence(gap),1,0,false,function(){recGap=false;recItem(my,0);});
}
function recItem(my,pos){
  if(my!==token)return;
  recGap=false;
  if(qi>=Q.length){if(audio)audio.pause();finish();return;}
  var it=Q[qi];
  if(it.k==="p"){
    if(canNativePlain()&&!document.hidden){recPlain(my);return;}
    if(!document.hidden&&!plainSkipNoted){plainSkipNoted=true;toast("這支手機沒有中文語音，白話先略過",4000);}
    qi++;sub=0;recItem(my,0);return;
  }
  var url=recGet(it.id);
  if(!url){qi++;recItem(my,0);return;}
  markItem(it,null);
  recPlay(my,url,recRate(),pos,false,function(){recNext(my,it);});
}

// 預錄模式下的白話：用手機語音（設定裡選的那個）逐句念，念完回到預錄
function recPlain(my){
  if(my!==token)return;
  var it=Q[qi],parts=splitLong(itemText(it));
  if(sub>=parts.length){recNext(my,it);return;}
  if(sub===0)markItem(it);
  if(!audio||!audio.loop||audio.paused)recPlay(my,silence(1000),1,0,true,function(){});
  var u=utter(parts[sub],"j");
  u.onend=function(){if(my!==token)return;sub++;setTimeout(function(){recPlain(my);},200);};
  u.onerror=function(ev){if(my!==token)return;if(ev.error==="interrupted"||ev.error==="canceled")return;toast("朗讀中斷了，請再按一次「繼續」");state="paused";setUI();};
  speechSynthesis.speak(u);
}
function recOnPlain(){return eng==="rec"&&Q[qi]&&Q[qi].k==="p";}

/* Claude 語音：整串一次送出，白話、註解用不同聲線 */
function cvoiceFor(k){
  if(k==="j")return S.cvoice;
  var alts=["buttery","airy","glassy","rounded"].filter(function(v){return v!==S.cvoice;});
  return k==="p"?alts[0]:alts[1];
}
function claudeOpts(){return {voice:S.cvoice,rate:Math.max(0.7,S.rate),language:"zh-TW"};}
function claudeRun(my){
  var lines=Q.slice(qi).map(function(it,n){return {text:itemText(it,n===0?qFrom:null),id:it.id,voice:cvoiceFor(it.k)};});
  q0=qi;markItem(Q[qi],qFrom);
  claudeTts.speak(lines,claudeOpts()).then(function(){if(my===token&&state==="playing")finish();})
    .catch(function(err){if(my===token)claudeFail(err);});
}
function claudeFail(err){
  var c=err&&err.code;
  if(c==="stopped"){if(err.reason!=="replaced"&&state!=="paused")finish();return;}
  finish();
  if(c==="not_granted"){claudeOff=true;renderVoiceUI();noSpeech();}
  else if(c==="unavailable"){claudeTts=null;renderVoiceUI();toast("目前無法使用 Claude 語音，已改用手機語音，請再按一次「朗讀」",5000);}
  else if(c==="rate_limited")toast("朗讀次數暫時太多，請稍候再試",4000);
  else if(c==="no_gesture")toast("請再按一次「朗讀」");
  else if(c==="busy")toast("請稍候再試");
  else toast("朗讀中斷了，請再按一次「朗讀」");
}

/* 使用者想要的引擎（auto 的順序：預錄 → Claude 語音 → 手機語音） */
function wantEngine(){
  var w=S.engine;
  if(w==="auto")w=recReady()?"rec":"claude";
  if(w==="rec")return recReady()?"rec":(claudeTts?"claude":"device");
  if(w==="claude")return claudeTts?"claude":"device";
  return "device";
}
// 實際可用的引擎；使用者在頁面權限關掉 Claude 語音時，不自動改用手機語音
function engineNow(){
  var w=wantEngine();
  if(w==="rec")return "rec";
  if(w==="claude")return claudeOff?null:"claude";
  return hasNative?"native":null;
}
function setUI(){
  var lbl=state==="playing"?"暫停":(state==="paused"?"繼續":null);
  $("play").textContent=lbl||"朗讀";
  $("nPlay").textContent=lbl||"朗讀註解";
  $("pPlay").textContent=lbl||"朗讀白話";
  $("stop").disabled=$("nStop").disabled=$("pStop").disabled=(state==="idle");
  $("rate").textContent="語速 "+(S.rate===1?"1.0":S.rate);
  syncMedia();
}
function setTemp(tp,tn){if(tp!==temp.p||tn!==temp.n){temp.p=tp;temp.n=tn;buildRead();}}
function finish(){state="idle";Q=[];qi=0;sub=0;qFrom=null;clearMarks();setTemp("","");setUI();}
// only："p"／"n" 只念白話／註解；startId 從哪一項開始；from 經文從第幾個子句開始；custom 自訂佇列（試聽）
function play(only,startId,from,custom){
  var e=engineNow();
  if(!e){noSpeech();return;}
  if(state!=="idle")halt();
  eng=e;token++;var my=token;
  if(!only&&!custom){
    var rp=hasPlain?S.readPlain:"off",rn=hasNotes?S.readNotes:"off";
    setTemp(rp==="inter"&&S.plain!=="line"?"line":(rp==="after"&&S.plain==="off"?"end":""),
            rn==="inter"&&S.notes!=="line"?"line":"");
  }
  Q=custom||buildQueue(only);qOnly=custom?null:(only||null);
  qi=startId?Math.max(0,qIndex(startId)):0;q0=qi;sub=0;qFrom=from!=null?from:null;
  if(!Q.length){finish();return;}
  state="playing";setUI();
  if(eng==="native"){
    speechSynthesis.cancel();
    if(!voice&&speechSynthesis.getVoices().length)toast("這台手機找不到中文語音，請在系統設定的「文字轉語音」安裝中文（台灣）語音",5000);
    setTimeout(function(){nativeStep(my);},60);
  }else if(eng==="rec")recItem(my,0);
  else claudeRun(my);
}
// 停掉目前的引擎，不改變狀態
function halt(){
  token++;
  if(eng==="native"){speechSynthesis.cancel();}
  else if(eng==="rec"){if(audio)audio.pause();if(hasNative)speechSynthesis.cancel();}
  else if(eng==="claude"&&claudeTts){claudeTts.stop().catch(function(){});}
}
function pause(){
  if(eng==="native"||recOnPlain()){token++;speechSynthesis.cancel();if(eng==="rec"&&audio)audio.pause();}
  else if(eng==="rec"){token++;recPos=(audio.ended||recGap)?0:audio.currentTime;recGap=false;audio.pause();}
  else if(eng==="claude"){claudeTts.pause().catch(function(){});}
  state="paused";setUI();
}
function resume(){
  if(!Q.length){finish();return;}
  if(eng==="claude"&&claudeTts&&claudeTts.active()){claudeTts.resume().catch(function(){});state="playing";setUI();return;}
  if(engineNow()!==eng){var id=Q[qi].id;play(qOnly,id);return;}
  token++;state="playing";setUI();
  if(eng==="native")nativeStep(token);
  else if(eng==="rec")recItem(token,recPos);
  else claudeRun(token);
}
function stopAll(){halt();finish();}
function noSpeech(){
  setUI();
  if(claudeOff)toast("這個頁面的 Claude 語音朗讀已關閉。如要改用手機語音，請到設定的「朗讀聲音」選擇",5000);
  else toast("這個畫面無法朗讀。請在 Chrome 瀏覽器開啟這個網頁再試",5000);
}
function toggle(only){
  if(state==="playing")pause();else if(state==="paused")resume();else play(only);
}
// 預錄念白話時關掉螢幕：手機語音會停，改接下一項預錄（底下的靜音還在播，可以接得上）
document.addEventListener("visibilitychange",function(){
  if(!document.hidden||state!=="playing"||!recOnPlain())return;
  token++;try{speechSynthesis.cancel();}catch(e){}
  var my=token;qi++;sub=0;recPos=0;recItem(my,0);
});
// 鎖定畫面、通知列的播放控制（Media Session）；只在預錄時有作用，其他引擎不經過 audio 元素
function syncMedia(){
  try{
    if(!("mediaSession" in navigator))return;
    var ms=navigator.mediaSession;
    if(!ms.metadata&&window.MediaMetadata)ms.metadata=new MediaMetadata({title:"般若波羅蜜多心經",artist:"預錄朗讀",
      artwork:[{src:$("appIcon").href,sizes:"512x512",type:"image/png"}]});
    ms.playbackState=state==="playing"?"playing":(state==="paused"?"paused":"none");
  }catch(e){}
}
(function(){
  if(!("mediaSession" in navigator))return;
  var h={play:function(){if(state==="paused")resume();else if(state==="idle")play(null);},
         pause:function(){if(state==="playing")pause();},
         stop:stopAll};
  Object.keys(h).forEach(function(k){try{navigator.mediaSession.setActionHandler(k,h[k]);}catch(e){}});
})();
$("play").onclick=function(){toggle(null);};
$("nPlay").onclick=function(){toggle("n");};
$("pPlay").onclick=function(){toggle("p");};
$("stop").onclick=$("nStop").onclick=$("pStop").onclick=stopAll;
$("rate").onclick=function(){
  var k=RATES.indexOf(S.rate);S.rate=RATES[(k+1)%RATES.length];saveS();setUI();
  if(state!=="playing")return;
  if(recOnPlain()){token++;speechSynthesis.cancel();var mp=token;setTimeout(function(){recPlain(mp);},60);}
  else if(eng==="rec")audio.defaultPlaybackRate=audio.playbackRate=recRate();
  else if(eng==="native"){token++;speechSynthesis.cancel();var my=token;setTimeout(function(){nativeStep(my);},60);}
  else if(eng==="claude"&&claudeTts.setRate)claudeTts.setRate(Math.max(0.7,S.rate)).catch(function(){});
};
// 點經文從該處開始；點白話、註解從該句開始（不在目前朗讀設定的佇列裡時，只念白話或只念註解）
function startAt(id,kind,from){
  var inFull=buildQueue(null).some(function(it){return it.id===id;});
  play(inFull?null:kind,id,from);
}
function onReadClick(e,panel){
  var pp=e.target.closest(".pp");if(pp){if(panel)play("n","n:"+pp.dataset.s+":0");else startAt("n:"+pp.dataset.s+":0","n");return;}
  var ns=e.target.closest(".ns");if(ns){var nid="n:"+ns.dataset.s+":"+ns.dataset.c;if(panel)play("n",nid);else startAt(nid,"n");return;}
  var pl=e.target.closest(".pl");if(pl){var pid="p:"+pl.dataset.s;if(panel)play("p",pid);else startAt(pid,"p");return;}
  var el=e.target.closest(".cl");if(!el)return;

$("sutra").addEventListener("click",function(e){onReadClick(e,false);});
$("notesScroll").addEventListener("click",function(e){onReadClick(e,true);});
$("plainScroll").addEventListener("click",function(e){onReadClick(e,true);});

/* ---------- 朗讀聲音設定 ---------- */

  }

  if(!claudeTts&&w!=="rec")note+="Claude 語音只在 claude.ai 網頁（Chrome 等瀏覽器）開啟時可用。";

document.querySelectorAll("#engineSeg button").forEach(function(b){b.onclick=function(){

$("testVoice").onclick=function(){

  stopAll();
  var k=Math.min(1,SEGS.length-1),q=[mkItem(k,"j")];

if(hasNative){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice);}catch(e){speechSynthesis.onvoiceschanged=pickVoice;}}
if(window.claude&&window.claude.use){
  window.claude.use("tts").then(function(t){
    if(!t)return;claudeTts=t;
    t.onLine(function(o){
      if(eng!=="claude"||!o||!o.id||state==="idle")return;
      var n=qIndex(String(o.id));if(n<0)return;
      qi=n;markItem(Q[n],n===q0?qFrom:null);
    });
    t.onState(function(e){
      if(eng!=="claude"||e.state!=="idle"||state==="idle")return;

/* ---------- 描寫 ---------- */
var N=CHARS.length;
var strokes={};
for(var k=0;k<N;k++){var v=load("xj.s."+k,null);if(v&&v.length)strokes[k]=v;}
var idx=Math.min(N-1,Math.max(0,load("xj.idx",0)|0));
var size=0,dpr=1;
var gCtx=$("guide").getContext("2d"),iCtx=$("ink").getContext("2d");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function doneCount(){var c=0;for(var k in strokes)if(strokes[k]&&strokes[k].length)c++;return c;}
function updatePos(){
  var label=idx<TITLE.length?"經題":"經文";
  $("pos").innerHTML="";
  var b=document.createElement("b");b.textContent=label+"　第 "+(idx+1)+" 字";
  $("pos").append(b," ／ "+N+"　已描 "+doneCount()+" 字");
  $("prev").disabled=idx===0;
  $("next").textContent=idx===N-1?"完成":"下一字";
}
function layoutCell(){
  var st=$("stage");if(!st.clientWidth)return;
  var s=Math.floor(Math.min(st.clientWidth-32,st.clientHeight-20,560));
  if(s<120)s=120;
  size=s;dpr=Math.min(3,window.devicePixelRatio||1);
  var cell=$("cell");cell.style.width=s+"px";cell.style.height=s+"px";
  [$("guide"),$("ink")].forEach(function(c){c.width=Math.round(s*dpr);c.height=Math.round(s*dpr);});
  gCtx.setTransform(dpr,0,0,dpr,0,0);iCtx.setTransform(dpr,0,0,dpr,0,0);
  redrawGuide();redrawInk();
}
function drawGrid(ctx,s,color,diag){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(s/2,0);ctx.lineTo(s/2,s);ctx.moveTo(0,s/2);ctx.lineTo(s,s/2);
  if(diag){ctx.moveTo(0,0);ctx.lineTo(s,s);ctx.moveTo(s,0);ctx.lineTo(0,s);}
  ctx.stroke();ctx.restore();
}
function drawChar(ctx,ch,s,color,scale){
  ctx.save();ctx.fillStyle=color;ctx.font=Math.round(s*(scale||0.8))+"px "+fontStack();
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  var m=ctx.measureText(ch);
  var a=m.actualBoundingBoxAscent||s*0.6,d=m.actualBoundingBoxDescent||s*0.1;
  ctx.fillText(ch,s/2,s/2+(a-d)/2);ctx.restore();
}
function redrawGuide(){
  if(!size)return;
  gCtx.clearRect(0,0,size,size);
  drawGrid(gCtx,size,css("--grid"),true);
  drawChar(gCtx,CHARS[idx],size,css("--guide"),0.8);
}
// 筆畫：點為 {x,y,w}（CSS px）；儲存時正規化成 0–1000
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function seg(ctx,p,i){
  var a=i===1?p[0]:mid(p[i-2],p[i-1]),b=mid(p[i-1],p[i]);
  ctx.lineWidth=(p[i-1].w+p[i].w)/2;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(p[i-1].x,p[i-1].y,b.x,b.y);ctx.stroke();
}
function tail(ctx,p){
  var n=p.length;if(n<2)return;
  var a=mid(p[n-2],p[n-1]);
  ctx.lineWidth=p[n-1].w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p[n-1].x,p[n-1].y);ctx.stroke();
}
function dot(ctx,pt){ctx.beginPath();ctx.arc(pt.x,pt.y,pt.w/2,0,Math.PI*2);ctx.fill();}
function prep(ctx,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineCap="round";ctx.lineJoin="round";}
function decode(flat,s,ox,oy){var p=[];for(var j=0;j+2<flat.length;j+=3)p.push({x:ox+flat[j]/1000*s,y:oy+flat[j+1]/1000*s,w:flat[j+2]/10000*s});return p;}
function paintStrokes(ctx,list,s,color,ox,oy){
  if(!list)return;prep(ctx,color);
  list.forEach(function(flat){
    var p=decode(flat,s,ox||0,oy||0);
    if(p.length===1){dot(ctx,p[0]);return;}
    dot(ctx,p[0]);for(var i=1;i<p.length;i++)seg(ctx,p,i);tail(ctx,p);
  });
}
function redrawInk(){if(!size)return;iCtx.clearRect(0,0,size,size);paintStrokes(iCtx,strokes[idx],size,css("--stroke"));}

var live=null,activeId=null;
function ptFrom(e){var r=$("ink").getBoundingClientRect();return {x:(e.clientX-r.left)*size/r.width,y:(e.clientY-r.top)*size/r.height,t:e.timeStamp,pr:e.pressure,type:e.pointerType};}
function baseW(){return size*S.pen/100;}
function addPoint(q){
  var p=live,last=p[p.length-1];
  var dx=q.x-last.x,dy=q.y-last.y,dist=Math.hypot(dx,dy);
  if(dist<1.2)return;
  var dt=Math.max(1,q.t-last.t),v=dist/dt,target;
  if(q.type==="pen"&&q.pr>0&&q.pr!==0.5)target=baseW()*(0.3+q.pr*1.3);
  else target=baseW()*Math.min(1.35,Math.max(0.42,1.35-v*0.38));
  var w=last.w*0.72+target*0.28;
  p.push({x:q.x,y:q.y,w:w,t:q.t});
  prep(iCtx,css("--stroke"));seg(iCtx,p,p.length-1);
}
$("ink").addEventListener("pointerdown",function(e){
  if(activeId!==null||(e.pointerType==="mouse"&&e.button!==0))return;
  e.preventDefault();activeId=e.pointerId;
  try{$("ink").setPointerCapture(e.pointerId);}catch(err){}
  var q=ptFrom(e);
  live=[{x:q.x,y:q.y,w:baseW()*0.95,t:q.t}];
  prep(iCtx,css("--stroke"));dot(iCtx,live[0]);
});
$("ink").addEventListener("pointermove",function(e){
  if(e.pointerId!==activeId||!live)return;
  e.preventDefault();
  var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
  evs.forEach(function(ev){addPoint(ptFrom(ev));});
});
function endStroke(e){
  if(e.pointerId!==activeId||!live)return;
  activeId=null;
  prep(iCtx,css("--stroke"));tail(iCtx,live);
  var flat=[];live.forEach(function(p){flat.push(Math.round(p.x/size*1000),Math.round(p.y/size*1000),Math.round(p.w/size*10000));});
  live=null;
  (strokes[idx]=strokes[idx]||[]).push(flat);
  store("xj.s."+idx,strokes[idx]);updatePos();
  $("hint").textContent="";
}
$("ink").addEventListener("pointerup",endStroke);
$("ink").addEventListener("pointercancel",endStroke);

// 不可命名為 go：分頁切換的 go(v) 在同一函式範圍，同名會被後者覆蓋
function goChar(i){
  idx=Math.max(0,Math.min(N-1,i));store("xj.idx",idx);
  document.fonts.load("40px "+fontStack(),CHARS[idx]).catch(function(){}).then(function(){redrawGuide();redrawInk();});
  updatePos();
}
$("prev").onclick=function(){goChar(idx-1);};
$("next").onclick=function(){
  if(idx===N-1){var d=doneCount();toast(d===N?"全篇描寫圓滿":"已到最後一字，還有 "+(N-d)+" 字未描");openSheet();return;}
  goChar(idx+1);
};
$("undo").onclick=function(){var s=strokes[idx];if(s&&s.length){s.pop();store("xj.s."+idx,s);redrawInk();updatePos();}};
$("clear").onclick=function(){if(strokes[idx]&&strokes[idx].length){strokes[idx]=[];store("xj.s."+idx,[]);redrawInk();updatePos();}};
$("penRange").oninput=function(e){S.pen=+e.target.value;$("penOut").textContent=S.pen;saveS();};
var wipeArm=0;
$("wipe").onclick=function(){
  if(Date.now()-wipeArm>3000){wipeArm=Date.now();$("wipe").textContent="再按一次確認清除";setTimeout(function(){$("wipe").textContent="清除所有描寫";},3000);return;}
  for(var k=0;k<N;k++){try{localStorage.removeItem("xj.s."+k);}catch(e){}}
  strokes={};wipeArm=0;$("wipe").textContent="清除所有描寫";redrawInk();updatePos();renderGrid();toast("已清除所有描寫");
};

/* ---------- 整篇 ---------- */
function renderGrid(){
  if(!$("sheetView").classList.contains("on"))return;
  var g=$("grid");g.innerHTML="";
  var gc=css("--grid"),gu=css("--guide"),st=css("--stroke");
  var px=window.innerWidth>=720?56:46,r=Math.min(3,window.devicePixelRatio||1);
  CHARS.forEach(function(ch,i){
    if(i===TITLE.length){var br=document.createElement("span");br.className="gap";g.appendChild(br);}
    var b=document.createElement("button");b.className="mini"+(i===idx?" cur":"");b.setAttribute("aria-label","第 "+(i+1)+" 字 "+ch);
    var c=document.createElement("canvas");c.width=px*r;c.height=px*r;
    var ctx=c.getContext("2d");ctx.setTransform(r,0,0,r,0,0);
    var has=strokes[i]&&strokes[i].length;
    drawChar(ctx,ch,px,has?"rgba(128,128,128,.12)":gu,0.78);
    if(has)paintStrokes(ctx,strokes[i],px,st);
    b.appendChild(c);b.onclick=function(){closeSheet();goChar(i);};
    g.appendChild(b);
  });
  $("doneCount").textContent="已描 "+doneCount()+" ／ "+N;
  var cur=g.querySelector(".cur");if(cur)cur.scrollIntoView({block:"center",inline:"center"});
}
function openSheet(){$("sheetView").classList.add("on");renderGrid();}
function closeSheet(){$("sheetView").classList.remove("on");}
$("openSheet").onclick=openSheet;$("closeSheet").onclick=closeSheet;

var downloads=null;
if(window.claude&&window.claude.use){
  window.claude.use("downloads").then(function(d){if(d){downloads=d;$("exportImg").hidden=false;}}).catch(function(){});
}
$("exportImg").onclick=function(){
  if(!downloads)return;
  var rows=17,cell=96,m=90;
  var bodyChars=CHARS.slice(TITLE.length);
  var bodyCols=Math.ceil(bodyChars.length/rows);
  var cols=1+bodyCols+1;
  var W=cols*cell+m*2,H=rows*cell+m*2;
  var c=document.createElement("canvas");c.width=W;c.height=H;
  var ctx=c.getContext("2d");
  ctx.fillStyle="#F3F1EA";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(176,58,46,.55)";ctx.lineWidth=2;ctx.strokeRect(m,m,cols*cell,rows*cell);
  ctx.lineWidth=1;
  for(var k=1;k<cols;k++){ctx.beginPath();ctx.moveTo(m+k*cell,m);ctx.lineTo(m+k*cell,m+rows*cell);ctx.stroke();}
  function colX(col){return W-m-(col+1)*cell;}
  function put(i,col,row){
    var x=colX(col),y=m+row*cell,inset=cell*0.06,s=cell-inset*2;
    ctx.save();ctx.translate(x+inset,y+inset);
    if(strokes[i]&&strokes[i].length)paintStrokes(ctx,strokes[i],s,"#1C1B18");
    else drawChar(ctx,CHARS[i],s,"rgba(36,35,31,.13)",0.8);
    ctx.restore();
  }
  for(var t=0;t<TITLE.length;t++)put(t,0,t+1);
  for(var j=0;j<bodyChars.length;j++)put(TITLE.length+j,1+Math.floor(j/rows),j%rows);
  var d=new Date(),date="民國"+(d.getFullYear()-1911)+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日　敬書";
  ctx.fillStyle="#24231F";ctx.font=Math.round(cell*0.42)+"px "+fontStack();ctx.textAlign="center";ctx.textBaseline="middle";
  var dc=date.split(""),startY=m+rows*cell-dc.length*cell*0.5-cell*0.4;
  dc.forEach(function(ch,n){ctx.fillText(ch,colX(cols-1)+cell/2,startY+n*cell*0.5);});
  c.toBlob(function(blob){
    if(!blob){toast("圖片產生失敗，請再試一次");return;}
    downloads.save({filename:"心經描寫.png",data:blob}).then(function(){toast("已存成圖片");}).catch(function(err){
      if(err&&err.code==="declined")return;
      if(err&&err.code==="rate_limited"){toast("請稍候再試");return;}
      toast("這個畫面無法存檔");$("exportImg").hidden=true;
    });
  },"image/png");
};

/* ---------- 設定面板 ---------- */
function openSettings(){$("sheetBg").classList.add("on");$("settings").classList.add("on");}
function closeSettings(){$("sheetBg").classList.remove("on");$("settings").classList.remove("on");}
$("openSettings").onclick=openSettings;$("sheetBg").onclick=closeSettings;
// Escape 只在關閉面板時攔下，其他時候留給平台用來停止 Claude 語音
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape")return;
  var ids=["settings","sheetView","notesView","plainView"],open=ids.some(function(id){return $(id).classList.contains("on");});
  if(open){e.preventDefault();closeSettings();closeSheet();$("notesView").classList.remove("on");$("plainView").classList.remove("on");}
});

/* ---------- 分頁 ---------- */
// #read（或無 hash）、#trace、#preface（御製心經序）
function show(view){
  if(view!=="trace"&&!(view==="preface"&&DATA.preface.length))view="read";
  document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",String(t.dataset.view===view));});
  $("view-read").classList.toggle("on",view==="read");
  $("view-trace").classList.toggle("on",view==="trace");
  $("view-preface").classList.toggle("on",view==="preface");
  if(view!=="read"){if(state==="playing")pause();$("notesView").classList.remove("on");$("plainView").classList.remove("on");}
  if(view==="trace")requestAnimationFrame(layoutCell);
  if(view==="preface"){var sc=$("prefScroll");sc.scrollLeft=0;sc.scrollTop=0;}
}
function go(v){if(location.hash!=="#"+v)location.hash=v;else show(v);}
$("prefBack").onclick=function(){go("read");};
document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){go(t.dataset.view);};});
window.addEventListener("hashchange",function(){show(location.hash.slice(1));});

/* ---------- 加到主畫面 ---------- */
// 只在一般 https 網站（如 GitHub Pages）動態加上 manifest，讓 Chrome「加到主畫面」用「心」字圖示與名稱。
// claude.ai Artifact 與直接開檔案時略過，維持零網路請求。
(function(){
  try{
    if(location.protocol!=="https:"||/claude/.test(location.hostname))return;
    var icon=$("appIcon").href,base=location.href.split("#")[0];
    var m={name:"般若波羅蜜多心經",short_name:"心經",start_url:base,scope:base.replace(/[^\/]*$/,""),
      display:"standalone",background_color:"#ECEBE6",theme_color:"#16203A",
      icons:[{src:icon,sizes:"512x512",type:"image/png",purpose:"any"},{src:icon,sizes:"512x512",type:"image/png",purpose:"maskable"}]};
    var l=document.createElement("link");l.rel="manifest";
    l.href="data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(m));
    document.head.appendChild(l);
  }catch(e){}
})();

/* ---------- 啟動 ---------- */
buildRead();buildPreface();applyReadUI();applyFs();applyLayout();setUI();renderVoiceUI();
$("penRange").value=S.pen;$("penOut").textContent=S.pen;
if(typeof ResizeObserver!=="undefined")new ResizeObserver(function(){if($("view-trace").classList.contains("on"))layoutCell();}).observe($("stage"));
var onTheme=function(){redrawGuide();redrawInk();renderGrid();};
if(mq.addEventListener)mq.addEventListener("change",function(){if(S.theme==="auto")applyTheme();});
$("themeBtn").onclick=function(){S.theme=isDark()?"light":"dark";saveS();applyTheme();};
document.querySelectorAll("#themeSeg button").forEach(function(b){b.onclick=function(){S.theme=b.dataset.themeOpt;saveS();applyTheme();};});
applyTheme();
updatePos();
show(location.hash.slice(1));
idbGet("userFont").then(function(rec){
  if(rec&&rec.buf)return installUserFont(rec.name,rec.buf).catch(function(){if(S.font==="user")S.font="wenkai";});
  if(S.font==="user")S.font="wenkai";
}).then(function(){applyFont();});
})();
</script>
