<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>般若波羅蜜多心經</title>
<!-- 主畫面與分頁圖示：build.py 產生的 icons/icon-512.png 以 base64 內嵌 -->
<link rel="icon" type="image/png" sizes="512x512" href="data:image/png;base64,__ICON_B64__" id="appIcon">
<link rel="apple-touch-icon" href="data:image/png;base64,__ICON_B64__">
<meta name="application-name" content="心經">
<meta name="apple-mobile-web-app-title" content="心經">
<meta name="theme-color" content="#ECEBE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16203A" media="(prefers-color-scheme: dark)">
<style>
@font-face{font-family:"WenKai";src:url(data:font/woff2;base64,__FONT_B64__) format("woff2");font-display:block}
:root{
  --paper:#ECEBE6;--surface:#F7F6F2;--ink:#24231F;--ink-soft:#6C6A63;--line:#D5D2C8;
  --accent:#2C4775;--on-accent:#F7F6F2;--zhu:#B03A2E;--hl:rgba(44,71,117,.13);
  --guide:rgba(36,35,31,.15);--stroke:#1C1B18;--grid:rgba(176,58,46,.28);
  --sutra-font:"WenKai","Kaiti TC","BiauKai","DFKai-SB",serif;
  --fs:26px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16203A;--surface:#1D2946;--ink:#E8E0C8;--ink-soft:#A39E89;--line:#2F3D66;
    --accent:#D3B169;--on-accent:#16203A;--zhu:#C9634F;--hl:rgba(211,177,105,.17);
    --guide:rgba(211,177,105,.2);--stroke:#D8B86C;--grid:rgba(211,177,105,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16203A;--surface:#1D2946;--ink:#E8E0C8;--ink-soft:#A39E89;--line:#2F3D66;
  --accent:#D3B169;--on-accent:#16203A;--zhu:#C9634F;--hl:rgba(211,177,105,.17);
  --guide:rgba(211,177,105,.2);--stroke:#D8B86C;--grid:rgba(211,177,105,.22);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:"WenKai","Kaiti TC","BiauKai",serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

header{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line)}
.brand{font-size:20px;letter-spacing:.3em;margin:0;font-weight:400;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:none;border:0;font-size:17px;padding:8px 10px;min-height:44px;color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.icon-btn{background:none;border:0;min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--ink-soft);cursor:pointer;border-radius:22px}
.icon-btn svg{width:22px;height:22px}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* 讀誦 */
.scroll{flex:1;min-height:0;overflow:auto;padding:28px 22px;overscroll-behavior:contain}
.scroll.v{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden}
.scroll.h .sutra{max-width:30em;margin:0 auto}
.sutra{font-family:var(--sutra-font);font-size:var(--fs);line-height:2.15;letter-spacing:.14em}
.sutra .title{font-size:1.28em;font-weight:400;margin:0;letter-spacing:.24em}
.sutra .translator{font-size:.58em;color:var(--ink-soft);margin:0 0 1.6em;text-align:end;letter-spacing:.2em}
.scroll.v .sutra .translator{margin:0 0 1.4em}
.sutra .body{margin:0}
.cl{border-radius:5px;cursor:pointer;transition:background-color .25s,color .25s}
.cl.on{background:var(--hl);color:var(--accent)}
.scroll.v .sutra .end{margin-inline-start:0}

.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.btn{font-size:16px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sq{width:44px;padding:0}
.btn.rate{font-size:14px;padding:0 10px}

/* 描寫 */
.trace-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0 16px;color:var(--ink-soft);font-size:15px}
.trace-top b{color:var(--ink);font-weight:400}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 16px}
.cell{position:relative;background:var(--surface);border:1.5px solid var(--zhu);box-shadow:0 1px 0 var(--line)}
.cell canvas{position:absolute;inset:0;width:100%;height:100%}
#ink{touch-action:none;cursor:crosshair}
.hint{color:var(--ink-soft);font-size:14px;text-align:center;margin:0 16px 4px;min-height:1.2em}

/* 整篇 */
.overlay{position:fixed;inset:0;z-index:20;background:var(--paper);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay.on{display:flex}
.overlay header{gap:8px}
.overlay h2{font-size:18px;font-weight:400;margin:0;letter-spacing:.15em}
.grid-wrap{flex:1;min-height:0;overflow:auto;padding:16px}
.grid{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.grid-wrap.v{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden}
.mini{width:46px;height:46px;border:1px solid var(--grid);background:var(--surface);padding:0;cursor:pointer;position:relative}
.mini.cur{outline:2px solid var(--accent);outline-offset:1px}
.mini canvas{width:100%;height:100%;display:block}
.grid .gap{flex-basis:100%;width:0;height:0}

/* 設定 */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(10,12,20,.38);display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:16px 16px 0 0;padding:6px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.sheet h3{font-size:15px;font-weight:400;color:var(--ink-soft);margin:18px 0 8px}
.row{display:flex;align-items:center;gap:12px}
.row input[type=range]{flex:1;accent-color:var(--accent);height:32px}
.row output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:none;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.opt input{accent-color:var(--accent);width:20px;height:20px}
.opt small{color:var(--ink-soft)}
[hidden]{display:none!important}
.sel{width:100%;min-height:44px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.seg+.seg,.seg+.sel,.sel+.row,.seg+.row{margin-top:10px}
.seg button:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:6px 0 0}
.danger{color:var(--zhu);border-color:var(--zhu)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;line-height:1.5;max-width:88%;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:720px){.brand{font-size:22px}.mini{width:56px;height:56px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="brand">心經</h1>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="read" aria-selected="true">讀誦</button>
      <button class="tab" role="tab" data-view="trace" aria-selected="false">描寫</button>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="切換夜間模式"></button>
    <button class="icon-btn" id="openSettings" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <main>
    <section class="view on" id="view-read" aria-label="讀誦">
      <div class="scroll v" id="scroll"><div class="sutra" id="sutra"></div></div>
      <div class="bar">
        <button class="btn sq" id="fsDown" aria-label="字縮小">小</button>
        <button class="btn sq" id="fsUp" aria-label="字放大">大</button>
        <button class="btn primary" id="play">朗讀</button>
        <button class="btn sq" id="stop" aria-label="停止" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
        </button>
        <button class="btn rate" id="rate">語速 0.8</button>
      </div>
    </section>

    <section class="view" id="view-trace" aria-label="描寫">
      <div class="trace-top">
        <span id="pos"></span>
        <button class="btn" id="openSheet">整篇</button>
      </div>
      <div class="stage" id="stage">
        <div class="cell" id="cell">
          <canvas id="guide"></canvas>
          <canvas id="ink"></canvas>
        </div>
      </div>
      <p class="hint" id="hint">用手指沿著淡字描寫</p>
      <div class="bar">
        <button class="btn" id="prev">上一字</button>
        <button class="btn" id="undo">復原</button>
        <button class="btn" id="clear">清除</button>
        <button class="btn primary" id="next">下一字</button>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="sheetView" aria-label="整篇">
  <header>
    <button class="icon-btn" id="closeSheet" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2>整篇</h2>
    <span id="doneCount" style="color:var(--ink-soft);font-size:15px;margin-left:auto"></span>
    <button class="btn" id="exportImg" hidden>存成圖片</button>
  </header>
  <div class="grid-wrap v" id="gridWrap"><div class="grid" id="grid"></div></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="settings" role="dialog" aria-label="設定">
  <div class="grab"></div>
  <h3>外觀</h3>
  <div class="seg" id="themeSeg">
    <button data-theme-opt="auto" aria-pressed="true">跟隨系統</button>
    <button data-theme-opt="light" aria-pressed="false">日間</button>
    <button data-theme-opt="dark" aria-pressed="false">夜間</button>
  </div>
  <h3>朗讀聲音</h3>
  <div class="seg" id="engineSeg">
    <button data-engine="claude" aria-pressed="false">Claude 語音</button>
    <button data-engine="device" aria-pressed="false">手機語音</button>
    <button data-engine="rec" aria-pressed="false" hidden>預錄</button>
  </div>
  <div class="seg" id="cvoiceSeg">
    <button data-cvoice="buttery" aria-pressed="false">柔順</button>
    <button data-cvoice="airy" aria-pressed="false">輕盈</button>
    <button data-cvoice="glassy" aria-pressed="false">清亮</button>
    <button data-cvoice="rounded" aria-pressed="false">圓潤</button>
  </div>
  <select class="sel" id="dvoiceSel" aria-label="手機語音"></select>
  <div class="row" id="pitchRow"><span>音高</span><input type="range" id="pitchRange" min="0.7" max="1.3" step="0.05" aria-label="音高"><output id="pitchOut"></output></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="testVoice">試聽</button></div>
  <p class="note" id="voiceNote"></p>
  <h3>經文字級</h3>
  <div class="row"><input type="range" id="fsRange" min="16" max="60" step="1"><output id="fsOut"></output></div>
  <h3>排版</h3>
  <div class="seg" id="layoutSeg">
    <button data-layout="v" aria-pressed="true">直排</button>
    <button data-layout="h" aria-pressed="false">橫排</button>
  </div>
  <h3>字體</h3>
  <label class="opt"><input type="radio" name="font" value="wenkai"> 霞鶩文楷 <small>內建</small></label>
  <label class="opt"><input type="radio" name="font" value="user" id="userFontRadio" disabled> <span id="userFontName">自訂字體 <small>尚未選擇</small></span></label>
  <label class="opt"><input type="radio" name="font" value="system"> 裝置內建楷體 <small>依手機而定</small></label>
  <div class="row" style="margin-top:6px">
    <button class="btn" id="pickFont">選擇字體檔…</button>
    <button class="btn" id="removeFont" hidden>移除</button>
    <input type="file" id="fontFile" hidden>
  </div>
  <p class="note">可選 .ttf、.otf、.woff 或 .woff2。字體只存在這支手機的瀏覽器裡，換裝置要重新選一次。經文與描寫的淡字都會改用這套字體。</p>
  <h3>描寫筆畫粗細</h3>
  <div class="row"><input type="range" id="penRange" min="2" max="8" step="0.5"><output id="penOut"></output></div>
  <h3>描寫紀錄</h3>
  <button class="btn danger" id="wipe">清除所有描寫</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
var TITLE="般若波羅蜜多心經";
var TRANSLATOR="唐三藏法師玄奘　譯";
var BODY="觀自在菩薩，行深般若波羅蜜多時，照見五蘊皆空，度一切苦厄。舍利子，色不異空，空不異色，色即是空，空即是色，受想行識，亦復如是。舍利子，是諸法空相，不生不滅，不垢不淨，不增不減。是故空中無色，無受想行識，無眼耳鼻舌身意，無色聲香味觸法，無眼界，乃至無意識界，無無明，亦無無明盡，乃至無老死，亦無老死盡。無苦集滅道，無智亦無得。以無所得故，菩提薩埵，依般若波羅蜜多故，心無罣礙，無罣礙故，無有恐怖，遠離顛倒夢想，究竟涅槃。三世諸佛，依般若波羅蜜多故，得阿耨多羅三藐三菩提。故知般若波羅蜜多，是大神咒，是大明咒，是無上咒，是無等等咒，能除一切苦，真實不虛。故說般若波羅蜜多咒，即說咒曰：揭諦揭諦，波羅揭諦，波羅僧揭諦，菩提薩婆訶。";
var PUNCT=/[，。：；、]/g;
var clauses=[TITLE].concat(BODY.match(/[^，。：；]+[，。：；]?/g));
var CHARS=(TITLE+BODY.replace(PUNCT,"")).split("");
// 讀音校正：畫面顯示原文，送給語音引擎的是讀音正確的替代字
var SAY=[[/般若/g,"波惹"],[/舍利子/g,"社利子"],[/行/g,"形"],[/薩埵/g,"薩朵"],[/罣礙/g,"掛礙"]];
function spoken(t){SAY.forEach(function(r){t=t.replace(r[0],r[1]);});return t;}

var $=function(id){return document.getElementById(id);};
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
var toastT;
function toast(msg,ms){var t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},ms||2600);}

var S=Object.assign({fs:26,layout:"v",font:"wenkai",pen:4,rate:0.8,theme:"auto",engine:"auto",cvoice:"buttery",dvoice:"",pitch:1},load("xj.set",{}));
function saveS(){store("xj.set",S);}

/* ---------- 日間／夜間 ---------- */
var mq=window.matchMedia("(prefers-color-scheme: dark)");
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
function isDark(){return S.theme==="dark"||(S.theme==="auto"&&mq.matches);}
function applyTheme(){
  var root=document.documentElement;
  if(S.theme==="auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",S.theme);
  var dark=isDark();
  var tb=document.getElementById("themeBtn");
  tb.innerHTML=dark?SUN:MOON;tb.setAttribute("aria-label",dark?"切換日間模式":"切換夜間模式");
  document.querySelectorAll("#themeSeg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.themeOpt===S.theme));});
  if(typeof onTheme==="function")onTheme();
}

/* ---------- 字體 ---------- */
var STACKS={
  wenkai:'"WenKai","Kaiti TC","BiauKai",serif',
  user:'"UserFont","WenKai",serif',
  system:'"BiauKai","DFKai-SB","Kaiti TC","STKaiti","KaiTi","Noto Serif TC",serif'
};
var userFontName=null;
function fontStack(){return STACKS[S.font]||STACKS.wenkai;}
function applyFont(){
  document.documentElement.style.setProperty("--sutra-font",fontStack());
  document.querySelectorAll('input[name=font]').forEach(function(r){r.checked=(r.value===S.font);});
  return document.fonts.load("40px "+fontStack(),CHARS.join("")).catch(function(){}).then(function(){redrawGuide();renderGrid();});
}
// IndexedDB 存放使用者字體
function idb(){return new Promise(function(res,rej){try{var q=indexedDB.open("xinjing",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv");};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};}catch(e){rej(e);}});}
function idbGet(k){return idb().then(function(db){return new Promise(function(res){var r=db.transaction("kv").objectStore("kv").get(k);r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res){var tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};});}).catch(function(){return false;});}
function idbDel(k){return idb().then(function(db){db.transaction("kv","readwrite").objectStore("kv").delete(k);}).catch(function(){});}
var userFace=null;
function installUserFont(name,buf){
  var face=new FontFace("UserFont",buf);
  return face.load().then(function(f){
    if(userFace){try{document.fonts.delete(userFace);}catch(e){}}
    document.fonts.add(f);userFace=f;userFontName=name;
    $("userFontRadio").disabled=false;
    $("userFontName").innerHTML="";$("userFontName").append(name+" ");
    var sm=document.createElement("small");sm.textContent="自訂";$("userFontName").append(sm);
    $("removeFont").hidden=false;
  });
}
$("pickFont").onclick=function(){$("fontFile").click();};
$("fontFile").onchange=function(e){
  var f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  toast("正在載入字體…",8000);
  f.arrayBuffer().then(function(buf){
    return installUserFont(f.name.replace(/\.[^.]+$/,""),buf.slice(0)).then(function(){
      S.font="user";saveS();
      idbSet("userFont",{name:userFontName,buf:buf}).then(function(ok){if(!ok)toast("字體已套用，但這台裝置無法記住它，下次需重選");});
      return applyFont().then(function(){toast("已改用「"+userFontName+"」");});
    });
  }).catch(function(){toast("這個檔案無法當作字體使用，請選 .ttf、.otf、.woff 或 .woff2 檔",4000);});
};
$("removeFont").onclick=function(){

// 引擎：claude = Claude 語音（tts 能力，整句一行送出，較自然）；native = 手機的 speechSynthesis（逐句送出）
var RATES=[0.6,0.7,0.8,1,1.2];
var cur=0,state="idle",token=0,voice=null,eng=null,claudeTts=null,claudeOff=false,dvoices=[];
// 預錄朗讀：build.py 由 audio/ 內嵌 {voice, items:[{id:"起-迄", type, b64}]}；沒有音檔時為 null
var REC=/*__AUDIO__*/null;
var VOICE_NAMES={"zh-TW-HsiaoYuNeural":"曉雨","zh-TW-HsiaoChenNeural":"曉臻","zh-TW-YunJheNeural":"雲哲"};
var recUrls=null,recRanges=null,audio=null,recIdx=0,recPos=0;
function recReady(){return !!(REC&&REC.items&&REC.items.length);}
function recName(){return (REC&&VOICE_NAMES[REC.voice])||"";}
function recInit(){
  if(recUrls)return;
  recUrls=REC.items.map(function(it){
    var bin=atob(it.b64),u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([u8],{type:it.type||"audio/mpeg"}));
  });
  recRanges=REC.items.map(function(it){var p=String(it.id).split("-");return [+p[0],+p[1]];});
  audio=new Audio();audio.preload="auto";
}
// 錄音以 0.8 為原速；語速設定換算成播放速度（Chrome 預設保持音高）
function recRate(){return S.rate/0.8;}
function recFind(i){for(var k=0;k<recRanges.length;k++)if(recRanges[k][0]<=i&&i<=recRanges[k][1])return k;return 0;}
function recPlay(k,my,pos){
  if(my!==token)return;
  if(k>=recUrls.length){finish();return;}
  recIdx=k;recPos=0;
  var r=recRanges[k];cur=r[0];mark(r[0],r[1]);
  audio.onended=function(){
    if(my!==token)return;
    recIdx=k+1;recPos=0;
    setTimeout(function(){recPlay(k+1,my,0);},k===0?600:420);
  };
  audio.src=recUrls[k];
  audio.defaultPlaybackRate=audio.playbackRate=recRate();
  if(pos)audio.currentTime=pos;
  var pr=audio.play();
  if(pr&&pr.catch)pr.catch(function(e){
    if(my!==token||(e&&e.name==="AbortError"))return;
    finish();toast("無法播放預錄朗讀，請再按一次「朗讀」");
  });
}
var hasNative=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined";
function vlang(v){return (v.lang||"").replace("_","-").toLowerCase();}
function zhRank(v){
  var l=vlang(v);
  if(l==="zh-tw")return 0;
  if(/hant/.test(l))return 1;
  if(l==="zh-hk"||/yue/.test(l))return 3;
  if(l.indexOf("zh")===0||l.indexOf("cmn")===0)return 2;
  return -1;
}
function pickVoice(){
  if(!hasNative)return;
  var vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  dvoices=vs.filter(function(v){return zhRank(v)>=0;}).sort(function(a,b){
    return zhRank(a)-zhRank(b)||((a.localService===false)===(b.localService===false)?0:(a.localService===false?-1:1));
  });
  voice=dvoices.find(function(v){return v.voiceURI===S.dvoice;})||dvoices[0]||null;
  renderVoiceUI();
}
// 使用者想要的引擎（auto：有 Claude 語音就用）
// auto 的順序：預錄 → Claude 語音 → 手機語音
function wantEngine(){
  var w=S.engine;
  if(w==="auto")w=recReady()?"rec":"claude";
  if(w==="rec")return recReady()?"rec":(claudeTts?"claude":"device");
  if(w==="claude")return claudeTts?"claude":"device";
  return "device";
}
// 實際可用的引擎；使用者在頁面權限關掉 Claude 語音時，不自動改用手機語音
function engineNow(){
  var w=wantEngine();
  if(w==="rec")return "rec";
  if(w==="claude")return claudeOff?null:"claude";
  return hasNative?"native":null;
}
function mark(a,b){
  document.querySelectorAll(".cl.on").forEach(function(e){e.classList.remove("on");});
  if(a<0)return;
  if(b==null)b=a;
  var first=null;
  for(var i=a;i<=b;i++){var el=document.querySelector('.cl[data-i="'+i+'"]');if(el){el.classList.add("on");if(!first)first=el;}}
  if(first)first.scrollIntoView({block:"center",inline:"center",behavior:"smooth"});
}
function setUI(){
  $("play").textContent=state==="playing"?"暫停":(state==="paused"?"繼續":"朗讀");
  $("stop").disabled=(state==="idle");
  $("rate").textContent="語速 "+(S.rate===1?"1.0":S.rate);
}
function utter(text){
  var u=new SpeechSynthesisUtterance(text);
  u.lang=voice&&voice.lang?voice.lang:"zh-TW";if(voice)u.voice=voice;
  u.rate=S.rate;u.pitch=S.pitch;
  return u;
}
function nativeSay(i,my){
  if(my!==token)return;
  if(i>=clauses.length){finish();return;}
  cur=i;mark(i);
  var u=utter(spoken(clauses[i]));
  u.onend=function(){if(my!==token)return;setTimeout(function(){nativeSay(i+1,my);},/[。：]$/.test(clauses[i])?380:120);};
  u.onerror=function(ev){if(my!==token)return;if(ev.error==="interrupted"||ev.error==="canceled")return;toast("朗讀中斷了，請再按一次「繼續」");state="paused";setUI();};
  speechSynthesis.speak(u);
}
// 句末（。：）的子句序；經題自成一句
function sentenceEnd(i){if(i===0)return 0;var j=i;while(j<clauses.length-1&&!/[。：]$/.test(clauses[j]))j++;return j;}
function claudeLines(from){
  var lines=[];
  for(var i=from;i<clauses.length;){
    var e=sentenceEnd(i);
    lines.push({text:spoken(clauses.slice(i,e+1).join("")),id:i+"-"+e});
    i=e+1;
  }
  return lines;
}
function claudeOpts(){return {voice:S.cvoice,rate:Math.max(0.7,S.rate),language:"zh-TW"};}
function claudeFail(err){
  var c=err&&err.code;
  if(c==="stopped"){if(err.reason!=="replaced"&&state!=="paused")finish();return;}
  finish();
  if(c==="not_granted"){claudeOff=true;renderVoiceUI();noSpeech();}
  else if(c==="unavailable"){claudeTts=null;renderVoiceUI();toast("目前無法使用 Claude 語音，已改用手機語音，請再按一次「朗讀」",5000);}
  else if(c==="rate_limited")toast("朗讀次數暫時太多，請稍候再試",4000);
  else if(c==="no_gesture")toast("請再按一次「朗讀」");
  else if(c==="busy")toast("請稍候再試");
  else toast("朗讀中斷了，請再按一次「朗讀」");
}
function finish(){state="idle";cur=0;mark(-1);setUI();}
function play(from){
  eng=engineNow();
  if(!eng){noSpeech();return;}
  token++;var my=token;
  if(eng==="native"){
    speechSynthesis.cancel();
    if(!voice&&speechSynthesis.getVoices().length)toast("這台手機找不到中文語音，請在系統設定的「文字轉語音」安裝中文（台灣）語音",5000);
    state="playing";setUI();setTimeout(function(){nativeSay(from,my);},60);
  }else if(eng==="rec"){
    recInit();state="playing";setUI();recPlay(recFind(from),my,0);
  }else{
    cur=from;state="playing";setUI();mark(from,sentenceEnd(from));
    claudeTts.speak(claudeLines(from),claudeOpts()).then(function(){if(my===token&&state==="playing")finish();})
      .catch(function(err){if(my===token)claudeFail(err);});
  }
}
function pause(){
  if(eng==="native"){token++;speechSynthesis.cancel();}
  else if(eng==="rec"){token++;recPos=audio.ended?0:audio.currentTime;audio.pause();}
  else if(eng==="claude"){claudeTts.pause().catch(function(){});}
  state="paused";setUI();
}
function resume(){
  if(eng==="claude"&&claudeTts&&claudeTts.active()){claudeTts.resume().catch(function(){});state="playing";setUI();}
  else if(eng==="rec"&&engineNow()==="rec"){token++;state="playing";setUI();recPlay(recIdx,token,recPos);}
  else play(cur);
}
function stopAll(){
  token++;
  if(eng==="native"){speechSynthesis.cancel();}
  else if(eng==="rec"&&audio){audio.pause();}
  else if(eng==="claude"&&claudeTts){claudeTts.stop().catch(function(){});}
  finish();
}
function noSpeech(){
  $("play").textContent="朗讀";
  if(claudeOff)toast("這個頁面的 Claude 語音朗讀已關閉。如要改用手機語音，請到設定的「朗讀聲音」選擇",5000);
  else toast("這個畫面無法朗讀。請在 Chrome 瀏覽器開啟這個網頁再試",5000);
}
$("play").onclick=function(){
  if(state==="playing")pause();else if(state==="paused")resume();else play(cur);
};
$("stop").onclick=stopAll;
$("rate").onclick=function(){
  var k=RATES.indexOf(S.rate);S.rate=RATES[(k+1)%RATES.length];saveS();setUI();
  if(state==="playing"){if(eng==="rec")audio.defaultPlaybackRate=audio.playbackRate=recRate();else if(eng==="native")play(cur);else if(eng==="claude"&&claudeTts.setRate)claudeTts.setRate(Math.max(0.7,S.rate)).catch(function(){});}
};
$("sutra").addEventListener("click",function(e){
  var el=e.target.closest(".cl");if(!el)return;
  var i=+el.dataset.i;cur=i;
  if(!engineNow()){mark(i);noSpeech();return;}
  play(i);
});

document.querySelectorAll("#engineSeg button").forEach(function(b){b.onclick=function(){

$("testVoice").onclick=function(){

if(hasNative){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice);}catch(e){speechSynthesis.onvoiceschanged=pickVoice;}}

  window.claude.use("tts").then(function(t){

/* ---------- 描寫 ---------- */
var N=CHARS.length;
var strokes={};
for(var k=0;k<N;k++){var v=load("xj.s."+k,null);if(v&&v.length)strokes[k]=v;}
var idx=Math.min(N-1,Math.max(0,load("xj.idx",0)|0));
var size=0,dpr=1;
var gCtx=$("guide").getContext("2d"),iCtx=$("ink").getContext("2d");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function doneCount(){var c=0;for(var k in strokes)if(strokes[k]&&strokes[k].length)c++;return c;}
function updatePos(){
  var label=idx<TITLE.length?"經題":"經文";
  $("pos").innerHTML="";
  var b=document.createElement("b");b.textContent=label+"　第 "+(idx+1)+" 字";
  $("pos").append(b," ／ "+N+"　已描 "+doneCount()+" 字");
  $("prev").disabled=idx===0;
  $("next").textContent=idx===N-1?"完成":"下一字";
}
function layoutCell(){
  var st=$("stage");if(!st.clientWidth)return;
  var s=Math.floor(Math.min(st.clientWidth-32,st.clientHeight-20,560));
  if(s<120)s=120;
  size=s;dpr=Math.min(3,window.devicePixelRatio||1);
  var cell=$("cell");cell.style.width=s+"px";cell.style.height=s+"px";
  [$("guide"),$("ink")].forEach(function(c){c.width=Math.round(s*dpr);c.height=Math.round(s*dpr);});
  gCtx.setTransform(dpr,0,0,dpr,0,0);iCtx.setTransform(dpr,0,0,dpr,0,0);
  redrawGuide();redrawInk();
}
function drawGrid(ctx,s,color,diag){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(s/2,0);ctx.lineTo(s/2,s);ctx.moveTo(0,s/2);ctx.lineTo(s,s/2);
  if(diag){ctx.moveTo(0,0);ctx.lineTo(s,s);ctx.moveTo(s,0);ctx.lineTo(0,s);}
  ctx.stroke();ctx.restore();
}
function drawChar(ctx,ch,s,color,scale){
  ctx.save();ctx.fillStyle=color;ctx.font=Math.round(s*(scale||0.8))+"px "+fontStack();
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  var m=ctx.measureText(ch);
  var a=m.actualBoundingBoxAscent||s*0.6,d=m.actualBoundingBoxDescent||s*0.1;
  ctx.fillText(ch,s/2,s/2+(a-d)/2);ctx.restore();
}
function redrawGuide(){
  if(!size)return;
  gCtx.clearRect(0,0,size,size);
  drawGrid(gCtx,size,css("--grid"),true);
  drawChar(gCtx,CHARS[idx],size,css("--guide"),0.8);
}
// 筆畫：點為 {x,y,w}（CSS px）；儲存時正規化成 0–1000
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function seg(ctx,p,i){
  var a=i===1?p[0]:mid(p[i-2],p[i-1]),b=mid(p[i-1],p[i]);
  ctx.lineWidth=(p[i-1].w+p[i].w)/2;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(p[i-1].x,p[i-1].y,b.x,b.y);ctx.stroke();
}
function tail(ctx,p){
  var n=p.length;if(n<2)return;
  var a=mid(p[n-2],p[n-1]);
  ctx.lineWidth=p[n-1].w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p[n-1].x,p[n-1].y);ctx.stroke();
}
function dot(ctx,pt){ctx.beginPath();ctx.arc(pt.x,pt.y,pt.w/2,0,Math.PI*2);ctx.fill();}
function prep(ctx,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineCap="round";ctx.lineJoin="round";}
function decode(flat,s,ox,oy){var p=[];for(var j=0;j+2<flat.length;j+=3)p.push({x:ox+flat[j]/1000*s,y:oy+flat[j+1]/1000*s,w:flat[j+2]/10000*s});return p;}
function paintStrokes(ctx,list,s,color,ox,oy){
  if(!list)return;prep(ctx,color);
  list.forEach(function(flat){
    var p=decode(flat,s,ox||0,oy||0);
    if(p.length===1){dot(ctx,p[0]);return;}
    dot(ctx,p[0]);for(var i=1;i<p.length;i++)seg(ctx,p,i);tail(ctx,p);
  });
}
function redrawInk(){if(!size)return;iCtx.clearRect(0,0,size,size);paintStrokes(iCtx,strokes[idx],size,css("--stroke"));}

var live=null,activeId=null;
function ptFrom(e){var r=$("ink").getBoundingClientRect();return {x:(e.clientX-r.left)*size/r.width,y:(e.clientY-r.top)*size/r.height,t:e.timeStamp,pr:e.pressure,type:e.pointerType};}
function baseW(){return size*S.pen/100;}
function addPoint(q){
  var p=live,last=p[p.length-1];
  var dx=q.x-last.x,dy=q.y-last.y,dist=Math.hypot(dx,dy);
  if(dist<1.2)return;
  var dt=Math.max(1,q.t-last.t),v=dist/dt,target;
  if(q.type==="pen"&&q.pr>0&&q.pr!==0.5)target=baseW()*(0.3+q.pr*1.3);
  else target=baseW()*Math.min(1.35,Math.max(0.42,1.35-v*0.38));
  var w=last.w*0.72+target*0.28;
  p.push({x:q.x,y:q.y,w:w,t:q.t});
  prep(iCtx,css("--stroke"));seg(iCtx,p,p.length-1);
}
$("ink").addEventListener("pointerdown",function(e){
  if(activeId!==null||(e.pointerType==="mouse"&&e.button!==0))return;
  e.preventDefault();activeId=e.pointerId;
  try{$("ink").setPointerCapture(e.pointerId);}catch(err){}
  var q=ptFrom(e);
  live=[{x:q.x,y:q.y,w:baseW()*0.95,t:q.t}];
  prep(iCtx,css("--stroke"));dot(iCtx,live[0]);
});
$("ink").addEventListener("pointermove",function(e){
  if(e.pointerId!==activeId||!live)return;
  e.preventDefault();
  var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
  evs.forEach(function(ev){addPoint(ptFrom(ev));});
});
function endStroke(e){
  if(e.pointerId!==activeId||!live)return;
  activeId=null;
  prep(iCtx,css("--stroke"));tail(iCtx,live);
  var flat=[];live.forEach(function(p){flat.push(Math.round(p.x/size*1000),Math.round(p.y/size*1000),Math.round(p.w/size*10000));});
  live=null;
  (strokes[idx]=strokes[idx]||[]).push(flat);
  store("xj.s."+idx,strokes[idx]);updatePos();
  $("hint").textContent="";
}
$("ink").addEventListener("pointerup",endStroke);
$("ink").addEventListener("pointercancel",endStroke);

function go(i){
  idx=Math.max(0,Math.min(N-1,i));store("xj.idx",idx);
  document.fonts.load("40px "+fontStack(),CHARS[idx]).catch(function(){}).then(function(){redrawGuide();redrawInk();});
  updatePos();
}
$("prev").onclick=function(){go(idx-1);};
$("next").onclick=function(){
  if(idx===N-1){var d=doneCount();toast(d===N?"全篇描寫圓滿":"已到最後一字，還有 "+(N-d)+" 字未描");openSheet();return;}
  go(idx+1);
};
$("undo").onclick=function(){var s=strokes[idx];if(s&&s.length){s.pop();store("xj.s."+idx,s);redrawInk();updatePos();}};
$("clear").onclick=function(){if(strokes[idx]&&strokes[idx].length){strokes[idx]=[];store("xj.s."+idx,[]);redrawInk();updatePos();}};
$("penRange").oninput=function(e){S.pen=+e.target.value;$("penOut").textContent=S.pen;saveS();};
var wipeArm=0;
$("wipe").onclick=function(){
  if(Date.now()-wipeArm>3000){wipeArm=Date.now();$("wipe").textContent="再按一次確認清除";setTimeout(function(){$("wipe").textContent="清除所有描寫";},3000);return;}
  for(var k=0;k<N;k++){try{localStorage.removeItem("xj.s."+k);}catch(e){}}
  strokes={};wipeArm=0;$("wipe").textContent="清除所有描寫";redrawInk();updatePos();renderGrid();toast("已清除所有描寫");
};

/* ---------- 整篇 ---------- */
function renderGrid(){
  if(!$("sheetView").classList.contains("on"))return;
  var g=$("grid");g.innerHTML="";
  var gc=css("--grid"),gu=css("--guide"),st=css("--stroke");
  var px=window.innerWidth>=720?56:46,r=Math.min(3,window.devicePixelRatio||1);
  CHARS.forEach(function(ch,i){
    if(i===TITLE.length){var br=document.createElement("span");br.className="gap";g.appendChild(br);}
    var b=document.createElement("button");b.className="mini"+(i===idx?" cur":"");b.setAttribute("aria-label","第 "+(i+1)+" 字 "+ch);
    var c=document.createElement("canvas");c.width=px*r;c.height=px*r;
    var ctx=c.getContext("2d");ctx.setTransform(r,0,0,r,0,0);
    var has=strokes[i]&&strokes[i].length;
    drawChar(ctx,ch,px,has?"rgba(128,128,128,.12)":gu,0.78);
    if(has)paintStrokes(ctx,strokes[i],px,st);
    b.appendChild(c);b.onclick=function(){closeSheet();go(i);};
    g.appendChild(b);
  });
  $("doneCount").textContent="已描 "+doneCount()+" ／ "+N;
  var cur=g.querySelector(".cur");if(cur)cur.scrollIntoView({block:"center",inline:"center"});
}
function openSheet(){$("sheetView").classList.add("on");renderGrid();}
function closeSheet(){$("sheetView").classList.remove("on");}
$("openSheet").onclick=openSheet;$("closeSheet").onclick=closeSheet;

var downloads=null;
if(window.claude&&window.claude.use){
  window.claude.use("downloads").then(function(d){if(d){downloads=d;$("exportImg").hidden=false;}}).catch(function(){});
}
$("exportImg").onclick=function(){
  if(!downloads)return;
  var rows=17,cell=96,m=90;
  var bodyChars=CHARS.slice(TITLE.length);
  var bodyCols=Math.ceil(bodyChars.length/rows);
  var cols=1+bodyCols+1;
  var W=cols*cell+m*2,H=rows*cell+m*2;
  var c=document.createElement("canvas");c.width=W;c.height=H;
  var ctx=c.getContext("2d");
  ctx.fillStyle="#F3F1EA";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(176,58,46,.55)";ctx.lineWidth=2;ctx.strokeRect(m,m,cols*cell,rows*cell);
  ctx.lineWidth=1;
  for(var k=1;k<cols;k++){ctx.beginPath();ctx.moveTo(m+k*cell,m);ctx.lineTo(m+k*cell,m+rows*cell);ctx.stroke();}
  function colX(col){return W-m-(col+1)*cell;}
  function put(i,col,row){
    var x=colX(col),y=m+row*cell,inset=cell*0.06,s=cell-inset*2;
    ctx.save();ctx.translate(x+inset,y+inset);
    if(strokes[i]&&strokes[i].length)paintStrokes(ctx,strokes[i],s,"#1C1B18");
    else drawChar(ctx,CHARS[i],s,"rgba(36,35,31,.13)",0.8);
    ctx.restore();
  }
  for(var t=0;t<TITLE.length;t++)put(t,0,t+1);
  for(var j=0;j<bodyChars.length;j++)put(TITLE.length+j,1+Math.floor(j/rows),j%rows);
  var d=new Date(),date="民國"+(d.getFullYear()-1911)+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日　敬書";
  ctx.fillStyle="#24231F";ctx.font=Math.round(cell*0.42)+"px "+fontStack();ctx.textAlign="center";ctx.textBaseline="middle";
  var dc=date.split(""),startY=m+rows*cell-dc.length*cell*0.5-cell*0.4;
  dc.forEach(function(ch,n){ctx.fillText(ch,colX(cols-1)+cell/2,startY+n*cell*0.5);});
  c.toBlob(function(blob){
    if(!blob){toast("圖片產生失敗，請再試一次");return;}
    downloads.save({filename:"心經描寫.png",data:blob}).then(function(){toast("已存成圖片");}).catch(function(err){
      if(err&&err.code==="declined")return;
      if(err&&err.code==="rate_limited"){toast("請稍候再試");return;}
      toast("這個畫面無法存檔");$("exportImg").hidden=true;
    });
  },"image/png");
};

/* ---------- 設定面板 ---------- */
function openSettings(){$("sheetBg").classList.add("on");$("settings").classList.add("on");}
function closeSettings(){$("sheetBg").classList.remove("on");$("settings").classList.remove("on");}
$("openSettings").onclick=openSettings;$("sheetBg").onclick=closeSettings;
// Escape 只在關閉面板時攔下，其他時候留給平台用來停止 Claude 語音
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape")return;
  var open=$("settings").classList.contains("on")||$("sheetView").classList.contains("on");
  if(open){e.preventDefault();closeSettings();closeSheet();}
});

/* ---------- 分頁 ---------- */
function show(view){
  if(view!=="trace")view="read";
  document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",String(t.dataset.view===view));});
  $("view-read").classList.toggle("on",view==="read");
  $("view-trace").classList.toggle("on",view==="trace");
  if(view==="trace"){if(state==="playing")pause();requestAnimationFrame(layoutCell);}
}
document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){location.hash=t.dataset.view;show(t.dataset.view);};});
window.addEventListener("hashchange",function(){show(location.hash.slice(1));});

/* ---------- 加到主畫面 ---------- */
// 只在一般 https 網站（如 GitHub Pages）動態加上 manifest，讓 Chrome「加到主畫面」用「心」字圖示與名稱。
// claude.ai Artifact 與直接開檔案時略過，維持零網路請求。
(function(){
  try{
    if(location.protocol!=="https:"||/claude/.test(location.hostname))return;
    var icon=$("appIcon").href,base=location.href.split("#")[0];
    var m={name:"般若波羅蜜多心經",short_name:"心經",start_url:base,scope:base.replace(/[^\/]*$/,""),
      display:"standalone",background_color:"#ECEBE6",theme_color:"#16203A",
      icons:[{src:icon,sizes:"512x512",type:"image/png",purpose:"any"},{src:icon,sizes:"512x512",type:"image/png",purpose:"maskable"}]};
    var l=document.createElement("link");l.rel="manifest";
    l.href="data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(m));
    document.head.appendChild(l);
  }catch(e){}
})();

/* ---------- 啟動 ---------- */
buildSutra();applyFs();applyLayout();setUI();renderVoiceUI();
$("penRange").value=S.pen;$("penOut").textContent=S.pen;
if(typeof ResizeObserver!=="undefined")new ResizeObserver(function(){if($("view-trace").classList.contains("on"))layoutCell();}).observe($("stage"));
var onTheme=function(){redrawGuide();redrawInk();renderGrid();};
if(mq.addEventListener)mq.addEventListener("change",function(){if(S.theme==="auto")applyTheme();});
$("themeBtn").onclick=function(){S.theme=isDark()?"light":"dark";saveS();applyTheme();};
document.querySelectorAll("#themeSeg button").forEach(function(b){b.onclick=function(){S.theme=b.dataset.themeOpt;saveS();applyTheme();};});
applyTheme();
updatePos();
show(location.hash.slice(1));
idbGet("userFont").then(function(rec){
  if(rec&&rec.buf)return installUserFont(rec.name,rec.buf).catch(function(){if(S.font==="user")S.font="wenkai";});
  if(S.font==="user")S.font="wenkai";
}).then(function(){applyFont();});
})();
</script>
</body>
